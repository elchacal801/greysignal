
<!DOCTYPE html>
<html>
<head>
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        #timeline { width: 100%; height: 800px; border: 1px solid #30363d; background-color: #161b22; border-radius: 6px; }
        
        /* Default Item Style */
        .vis-item { border-color: #30363d !important; background-color: #161b22 !important; color: #8b949e !important; border-radius: 4px; font-size: 14px; border-width: 2px; }
        .vis-item.vis-selected { border-color: #f0f6fc !important; background-color: #1f6feb !important; z-index: 2; color: white !important; }
        
        /* Domain Specific Colors (Cyberpunk Palette) */
        /* Cyber: Neon Red */
        .vis-item.cyber { border-color: #ff0055 !important; background-color: #4a0018 !important; color: #ff99bb !important; }
        /* Finance: Gold */
        .vis-item.finance { border-color: #ffd700 !important; background-color: #3b3200 !important; color: #ffe680 !important; }
        /* Maritime: Ocean Blue */
        .vis-item.maritime { border-color: #00bfff !important; background-color: #002b3b !important; color: #80e5ff !important; }
        
        .vis-time-axis .vis-text { color: #8b949e; }
        .vis-loading { display: none; }
    </style>
</head>
<body>
    <h1>GreySignal: Cyber Intelligence Timeline</h1>
    <div style="text-align: center; margin-bottom: 20px; font-family: monospace; font-size: 16px;">
        <span style="color:#ff0055; margin-right: 20px;">■ Cyber Threat</span>
        <span style="color:#ffd700; margin-right: 20px;">■ Finance & Macro</span>
        <span style="color:#00bfff; margin-right: 20px;">■ Maritime & Infra</span>
        <span style="color:#8b949e;">■ General</span>
    </div>
    <div id="timeline"></div>
    <div id="error-msg" style="color: red; text-align: center; display: none;"></div>

    <script type="text/javascript">
        try {
            var container = document.getElementById('timeline');
            var rawData = [{"id": 0, "content": "<b>Dark Reading</b><br>Secure Your Spot at RSAC 2026 Conference", "start": "2026-03-23T11:00:00+00:00", "className": "cyber", "title": "..."}, {"id": 1, "content": "<b>The Maritime Executive</b><br>Mass Maritime Receives $5.8 M Grant to Develop/Train Shipbuilding Workforce", "start": "2026-01-18T03:28:42+00:00", "className": "maritime", "title": "Massachusetts Maritime Academy (MMA), a top-ranked public university with undergraduate degree programs focusing on science, engineering, technology,......"}, {"id": 2, "content": "<b>Bleeping Computer</b><br>Google Chrome now lets you turn off on-device AI model powering scam detection", "start": "2026-01-18T02:05:01+00:00", "className": "cyber", "title": "Google Chrome now lets you delete the local AI models that power the \"Enhanced Protection\" feature, which was upgraded with AI capabilities last year. [...]..."}, {"id": 3, "content": "<b>The Maritime Executive</b><br>How to Improve U.S. Army Corps of Engineers' Navigation Project Delivery", "start": "2026-01-17T17:49:30+00:00", "className": "maritime", "title": "Today, WCI released a study by HDR, Inc. (Recommendations for Improving the Delivery of Inland Waterway Capital Projects and accompanying infographic)......"}, {"id": 4, "content": "<b>The Maritime Executive</b><br>Birdon Awarded US Coast Guard Contract for Response Boat\u2013Small Demonstrator", "start": "2026-01-17T16:58:27+00:00", "className": "maritime", "title": "Birdon America, Inc. has been awarded a firm fixed price contract to build a Response Boat-Small (RB-S) Demonstrator for the United States Coast Guard......"}, {"id": 5, "content": "<b>The Hacker News</b><br>Black Basta Ransomware Leader Added to EU Most Wanted and INTERPOL Red Notice", "start": "2026-01-17T16:26:00+00:00", "className": "cyber", "title": "Ukrainian and German law enforcement authorities have identified two Ukrainians suspected of working for the Russia-linked ransomware-as-a-service (RaaS) group Black Basta. In addition, the group's al..."}, {"id": 6, "content": "<b>Bleeping Computer</b><br>Credential-stealing Chrome extensions target enterprise HR platforms", "start": "2026-01-17T16:19:30+00:00", "className": "cyber", "title": "Malicious Chrome extensions on the Chrome Web Store masquerading as productivity and security tools for enterprise HR and ERP platforms were discovered stealing authentication credentials or blocking ..."}, {"id": 7, "content": "<b>Bleeping Computer</b><br>Malicious GhostPoster browser extensions found with 840,000 installs", "start": "2026-01-17T15:23:34+00:00", "className": "cyber", "title": "Another set of 17 malicious extensions linked to the GhostPoster campaign has been discovered in Chrome, Firefox, and Edge stores, where they accumulated a total of 840,000 installations. [...]..."}]; 
            
            if (!rawData || rawData.length === 0) {
                document.getElementById('timeline').innerHTML = '<p style="text-align:center; padding-top: 50px;">No events to display.</p>';
            } else {
                var items = new vis.DataSet(rawData);
                
                // Calculate range with buffers
                var start = '2026-01-17T15:23:34+00:00';
                var end = '2026-03-23T11:00:00+00:00';
                
                var options = {
                    height: '800px',
                    start: start,
                    end: end,
                    zoomMin: 1000 * 60 * 60 * 24, // 1 day min zoom
                    zoomMax: 1000 * 60 * 60 * 24 * 31 * 12, // 1 year max
                    orientation: 'top'
                };
                
                var timeline = new vis.Timeline(container, items, options);
            }
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('error-msg').innerText = "Error loading timeline: " + e.message;
            document.getElementById('error-msg').style.display = 'block';
        }
    </script>
</body>
</html>
