<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Dark Reading</b><br>Black Hat USA", "start": "2026-08-01T11:00:00+00:00", "className": "cyber", "title": "Black Hat USA\n\n", "url": "https://www.darkreading.com/events/black-hat-usa", "source": "Dark Reading", "severity": "low"}, {"id": 1, "content": "<b>Data Center Knowledge</b><br>GITEX AI EUROPE", "start": "2026-06-30T11:00:00+00:00", "className": "maritime", "title": "GITEX AI EUROPE\n\n", "url": "https://www.datacenterknowledge.com/events/gitex-ai-europe", "source": "Data Center Knowledge", "severity": "low"}, {"id": 2, "content": "<b>Dark Reading</b><br>[Virtual Event] Anatomy of a Data Breach: What to Do if it Happens to You", "start": "2026-06-18T15:00:00+00:00", "className": "cyber", "title": "[Virtual Event] Anatomy of a Data Breach: What to Do if it Happens to You\n\n", "url": "https://www.darkreading.com/events/anatomy-of-a-data-breach-what-to-do-if-it-happens-to-you", "source": "Dark Reading", "severity": "critical"}, {"id": 3, "content": "<b>Dark Reading</b><br>Infosecurity Europe", "start": "2026-06-02T13:30:00+00:00", "className": "cyber", "title": "Infosecurity Europe\n\n", "url": "https://www.darkreading.com/events/infosecurity-europe", "source": "Dark Reading", "severity": "low"}, {"id": 4, "content": "<b>Bleeping Computer</b><br>Laravel Lang packages hijacked to deploy credential-stealing malware", "start": "2026-05-23T20:48:23+00:00", "className": "cyber", "title": "Laravel Lang packages hijacked to deploy credential-stealing malware\n\nA supply chain attack targeting the Laravel Lang localization packages has exposed developers to a sophisticated credential-stealing malware campaign after attackers abused GitHub version tags to distribute malicious code through Composer packages. [...]", "url": "https://www.bleepingcomputer.com/news/security/laravel-lang-packages-hijacked-to-deploy-credential-stealing-malware/", "source": "Bleeping Computer", "severity": "high"}, {"id": 5, "content": "<b>The Maritime Executive</b><br>Stock Check on Global Oil &amp; Gas on Cusp of War Decision", "start": "2026-05-23T19:06:26+00:00", "className": "maritime", "title": "Stock Check on Global Oil &amp; Gas on Cusp of War Decision\n\nA flurry of diplomatic movements, involving delegations from Pakistan and Qatar travelling to Tehran and the Iranian Foreign Minister travelling to M...", "url": "https://maritime-executive.com/article/stock-check-on-global-oil-gas-on-cusp-of-war-decision", "source": "The Maritime Executive", "severity": "low"}, {"id": 6, "content": "<b>The Maritime Executive</b><br>Canaveral Port Authority CEO Murray Inducted into Maritime Hall of Fame", "start": "2026-05-23T17:08:54+00:00", "className": "maritime", "title": "Canaveral Port Authority CEO Murray Inducted into Maritime Hall of Fame\n\nIn recognition of a distinguished maritime career spanning five decades, Captain John W. Murray, CEO of the Canaveral Port Authority, was inducted int...", "url": "https://maritime-executive.com/article/canaveral-port-authority-ceo-murray-inducted-into-maritime-hall-of-fame", "source": "The Maritime Executive", "severity": "low"}, {"id": 7, "content": "<b>The Maritime Executive</b><br>U.S. Coast Guard Commissions 62nd Fast Response Cutter Honoring 9/11 Hero", "start": "2026-05-23T16:58:06+00:00", "className": "maritime", "title": "U.S. Coast Guard Commissions 62nd Fast Response Cutter Honoring 9/11 Hero\n\nThe U.S. Coast Guard commissioned its newest Fast Response Cutter, USCGC Vincent Danz (WPC 1162), for official entry into its service fleet during a c...", "url": "https://maritime-executive.com/article/u-s-coast-guard-commissions-62nd-fast-response-cutter-honoring-9-11-hero", "source": "The Maritime Executive", "severity": "low"}, {"id": 8, "content": "<b>The Hacker News</b><br>npm Adds 2FA-Gated Publishing and Package Install Controls Against Supply Chain Attacks", "start": "2026-05-23T16:35:10+00:00", "className": "cyber", "title": "npm Adds 2FA-Gated Publishing and Package Install Controls Against Supply Chain Attacks\n\nGitHub has rolled out new controls for npm to improve the security of the software supply chain, giving maintainers the ability to explicitly approve a release prior to the packages becoming publicly available for installation. Called staged publishing, the feature is now generally available on npm.", "url": "https://thehackernews.com/2026/05/npm-adds-2fa-gated-publishing-and.html", "source": "The Hacker News", "severity": "low"}, {"id": 9, "content": "<b>The Maritime Executive</b><br>Retired Port of Aberdeen CFO Oakey Wins Finance Lifetime Achievement Award", "start": "2026-05-23T16:17:15+00:00", "className": "maritime", "title": "Retired Port of Aberdeen CFO Oakey Wins Finance Lifetime Achievement Award\n\nRecently retired Port of Aberdeen Chief Financial Officer Jon Oakey was honoured with the Lifetime Achievement Award at the second Finance &amp; Accounta...", "url": "https://maritime-executive.com/article/retired-port-of-aberdeen-cfo-oakey-wins-finance-lifetime-achievement-award", "source": "The Maritime Executive", "severity": "low"}, {"id": 10, "content": "<b>The Hacker News</b><br>Packagist Supply Chain Attack Infects 8 Packages Using GitHub-Hosted Linux Malware", "start": "2026-05-23T16:07:51+00:00", "className": "cyber", "title": "Packagist Supply Chain Attack Infects 8 Packages Using GitHub-Hosted Linux Malware\n\nA new &quot;coordinated&quot; supply chain attack campaign has impacted eight packages on Packagist including malicious code designed to run a Linux binary retrieved from a GitHub Releases URL. &quot;Although the affected packages were all Composer packages, the malicious code was not added to composer.json,&quot; Sock", "url": "https://thehackernews.com/2026/05/packagist-supply-chain-attack-infects-8.html", "source": "The Hacker News", "severity": "high"}, {"id": 11, "content": "<b>The Maritime Executive</b><br>Carnival Corporation Marks First Meal Donation in Latin America", "start": "2026-05-23T16:04:23+00:00", "className": "maritime", "title": "Carnival Corporation Marks First Meal Donation in Latin America\n\nBy [Carnival Corporation] Carnival Corporation, the world&#x27;s largest cruise company, today announced its first surplus meal donation in Latin America,...", "url": "https://maritime-executive.com/article/carnival-corporation-marks-first-meal-donation-in-latin-america", "source": "The Maritime Executive", "severity": "low"}, {"id": 12, "content": "<b>Bleeping Computer</b><br>Italy disrupts CINEMAGOAL piracy app that stole streaming auth codes", "start": "2026-05-23T14:23:44+00:00", "className": "cyber", "title": "Italy disrupts CINEMAGOAL piracy app that stole streaming auth codes\n\nItalian authorities have dismantled a piracy ecosystem centered around the CINEMAGOAL app that provided access to various streaming platforms, including Netflix, Disney+, and Spotify. [...]", "url": "https://www.bleepingcomputer.com/news/legal/italy-disrupts-cinemagoal-piracy-app-that-stole-streaming-auth-codes/", "source": "Bleeping Computer", "severity": "low"}, {"id": 13, "content": "<b>The Hacker News</b><br>Claude Mythos AI Finds 10,000 High-Severity Flaws in Widely Used Software", "start": "2026-05-23T11:55:35+00:00", "className": "cyber", "title": "Claude Mythos AI Finds 10,000 High-Severity Flaws in Widely Used Software\n\nAnthropic on Friday disclosed that Project Glasswing has helped uncover more than 10,000 high- or critical-severity vulnerabilities across some of the most &quot;systemically&quot; important software across the world since the cybersecurity initiative went live last month. Project Glasswing is a defensive eff", "url": "https://thehackernews.com/2026/05/claude-mythos-ai-finds-10000-high.html", "source": "The Hacker News", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-05-23T11:55:35+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
