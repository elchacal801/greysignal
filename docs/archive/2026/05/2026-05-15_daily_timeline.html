s-events/alerts/2026/05/14/cisa-adds-one-known-exploited-vulnerability-catalog", "source": "CISA Cybersecurity Advisories", "severity": "low"}, {"id": 63, "content": "<b>CISA Cybersecurity Advisories</b><br>Siemens SIPROTEC 5", "start": "2026-05-14T12:00:00+00:00", "className": "default", "title": "Siemens SIPROTEC 5\n\nView CSAF Summary The SIPROTEC 5 devices do not use sufficiently random numbers to generate session identifiers. This could facilitate a brute-force attack against a valid session identifier which could allow an unauthenticated remote attacker to hijack a valid user session. The affected session ide", "url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-134-13", "source": "CISA Cybersecurity Advisories", "severity": "low"}, {"id": 64, "content": "<b>CISA Cybersecurity Advisories</b><br>Siemens Industrial Devices", "start": "2026-05-14T12:00:00+00:00", "className": "default", "title": "Siemens Industrial Devices\n\nView CSAF Summary Multiple industrial devices contain a vulnerability that could allow an attacker to cause a denial of service condition. Siemens has released new versions for several affected products and recommends to update to the latest versions. Siemens is preparing further fix versions and re", "url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-134-06", "source": "CISA Cybersecurity Advisories", "severity": "low"}, {"id": 65, "content": "<b>Data Center Knowledge</b><br>Equinix Expands Fabric Geo Zones to Tackle Data Sovereignty", "start": "2026-05-14T12:00:00+00:00", "className": "maritime", "title": "Equinix Expands Fabric Geo Zones to Tackle Data Sovereignty\n\nThe company is positioning network-level sovereignty controls as a critical layer for distributed AI and hybrid multicloud infrastructure.", "url": "https://www.datacenterknowledge.com/infrastructure/equinix-expands-fabric-geo-zones-to-tackle-data-sovereignty", "source": "Data Center Knowledge", "severity": "low"}, {"id": 66, "content": "<b>Dark Readi <br>AI Transforms Data Centers into Power and Cooling Plants", "start": "2026-05-14T11:16:17+00:00", "className": "maritime", "title": "AI Transforms Data Centers into Power and Cooling Plants\n\nDense GPU clusters are reshaping data center design and widening the gap between AI factories and legacy enterprise facilities.", "url": "https://www.datacenterknowledge.com/build-design/ai-transforms-data-centers-into-power-and-cooling-plants", "source": "Data Center Knowledge", "severity": "low"}, {"id": 70, "content": "<b>Schneier on Security</b><br>How Dangerous Is Anthropic\u2019s Mythos AI?", "start": "2026-05-14T11:04:27+00:00", "className": "finance", "title": "How Dangerous Is Anthropic\u2019s Mythos AI?\n\nLast month, Anthropic made a remarkable announcement about its new model, Claude Mythos Preview: it was so good at finding security vulnerabilities in software that the company would not release it to the general public. Instead, it would only be available to a select group of companies to scan and ", "url": "https://www.schneier.com/blog/archives/2026/05/how-dangerous-is-anthropics-mythos-ai.html", "source": "Schneier on Security", "severity": "low"}, {"id": 71, "content": "<b>Securelist (Kaspersky)</b><br>Kimsuky targets organizations with PebbleDash-based tools", "start": "2026-05-14T11:00:58+00:00", "className": "cyber", "title": "Kimsuky targets organizations with PebbleDash-based tools\n\nKaspersky researchers analyze a range of new PebbleDash-based tools used in recent Kimsuky campaigns and reveal their connection to the AppleSeed malware cluster.", "url": "https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/", "source": "Securelist (Kaspersky)", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-05-14T11:00:58+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
