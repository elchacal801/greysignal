<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

d integrate economic statecraft into strategy, defense practice, and the broader national security ecosystem. This special series is brought to you by the Potomac Institute for Poli", "url": "https://warontherocks.com/2026/04/sharpening-signals-and-reducing-noise-for-better-defense-budgets/", "source": "War on the Rocks", "severity": "low"}, {"id": 4, "content": "<b>Data Center Knowledge</b><br>Threat Group Breaches AWS, Azure With Stolen Credentials", "start": "2026-04-06T07:15:00+00:00", "className": "maritime", "title": "Threat Group Breaches AWS, Azure With Stolen Credentials\n\nTeamPCP\u2019s shift to speedy attacks on AWS, Azure, and SaaS instances shows organizations need to respond quickly to compromised credentials.", "url": "https://www.datacenterknowledge.com/cybersecurity/threat-group-breaches-aws-azure-with-stolen-credentials", "source": "Data Center Knowledge", "severity": "low"}, {"id": 5, "content": "<b>The Hacker News</b><br>BKA Identifies REvil Leaders Behind 130 German Ransomware Attacks", "start": "2026-04-06T06:59:00+00:00", "className": "cyber", "title": "BKA Identifies REvil Leaders Behind 130 German Ransomware Attacks\n\nGermany&#x27;s Federal Criminal Police Office (aka BKA or the Bundeskriminalamt) has unmasked the real identity of the main threat actors associated with the now-defunct REvil (aka Sodinokibi) ransomware-as-a-service (RaaS) operation. The threat actor, who went by the alias UNKN, functioned as a represen", "url": "https://thehackernews.com/2026/04/bka-identifies-revil-leaders-behind-130.html", "source": "The Hacker News", "severity": "low"}, {"id": 6, "content": "<b>IntelNews</b><br>Opinion: The Mossad\u2019s plan to overthrow the regime in Iran was leaked", "start": "2026-04-06T04:22:41+00:00", "className": "geopolitics", "title": "Opinion: The Mossad\u2019s plan to overthrow the regime in Iran was leaked\n\nON SUNDAY MARCH 22, The New York Times reported that the United States and Israel launched the war in Iran with a cent mal-lng-to-asia", "source": "The Maritime Executive", "severity": "low"}, {"id": 13, "content": "<b>Bleeping Computer</b><br>Traffic violation scams switch to QR codes in new phishing texts", "start": "2026-04-05T19:44:10+00:00", "className": "cyber", "title": "Traffic violation scams switch to QR codes in new phishing texts\n\nScammers are sending fake &quot;Notice of Default&quot; traffic violation text messages impersonating state courts across the U.S., pressuring recipients to scan a QR code that leads to a phishing site demanding a $6.99 payment while stealing personal and financial information. [...]", "url": "https://www.bleepingcomputer.com/news/security/traffic-violation-scams-switch-to-qr-codes-in-new-phishing-texts/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 14, "content": "<b>The Maritime Executive</b><br>Agility at Sea: Geopolitical Shocks Reshape Energy Shipping", "start": "2026-04-05T19:26:00+00:00", "className": "maritime", "title": "Agility at Sea: Geopolitical Shocks Reshape Energy Shipping\n\nConflict in the Middle East has practically halted shipping traffic through the Strait of Hormuz. The narrow passageway is not technically closed, but...", "url": "https://maritime-executive.com/article/agility-at-sea-geopolitical-shocks-reshape-energy-shipping", "source": "The Maritime Executive", "severity": "low"}, {"id": 15, "content": "<b>Bleeping Computer</b><br>New FortiClient EMS flaw exploited in attacks, emergency patch released", "start": "2026-04-05T18:45:17+00:00", "className": "cyber", "title": "New FortiClient EMS flaw exploited in attacks, emergency patch released\n\nFortinet has released an emergency weekend security update for a new critical FortiClient Enterprise Management Server (EMS) vulnerability that is actively exploited in attacks. [...]", "url": "https://www.bleepingcomputer.com/news/security/new-fortinet-forticlient-ems-flaw-cve-2026-35616-exploited-in-attacks/", "source": "Bleeping Computer", "severity": "critical"}, {"id": 16, "content": "<b>The Maritime Executive</b><br>Amidst War, Iran&#x27;s Merchant Fleet is Enjoying Boom Times", "start": "2026-04-05T18:35:00+00:00", "className": "maritime", "title": "Amidst War, Iran&#x27;s Merchant Fleet is Enjoying Boom Times\n\nThe merchant marine tends to sail on regardless in time of war, notwithstanding the risk. As the risk goes up, so do cargo rates. And so also does de...", "url": "https://maritime-executive.com/article/amidst-war-iran-s-merchant-fleet-is-enjoying-boom-times", "source": "The Maritime Executive", "severity": "low"}, {"id": 17, "content": "<b>The Hacker News</b><br>$285 Million Drift Hack Traced to Six-Month DPRK Social Engineering Operation", "start": "2026-04-05T18:25:00+00:00", "className": "cyber", "title": "$285 Million Drift Hack Traced to Six-Month DPRK Social Engineering Operation\n\nDrift has revealed that the April 1, 2026, attack that led to the theft of $285 million was the culmination of a months-long targeted and meticulously planned social engineering operation undertaken by the Democratic People&#x27;s Republic of Korea (DPRK) that began in the fall of 2025. The Solana-based ", "url": "https://thehackernews.com/2026/04/285-million-drift-hack-traced-to-six.html", "source": "The Hacker News", "severity": "low"}, {"id": 18, "content": "<b>The Maritime Executive</b><br>Op-Ed: An Urgent Need for Quicker and Cheaper Naval Procurement", "start": "2026-04-05T17:45:00+00:00", "className": "maritime", "title": "Op-Ed: An Urgent Need for Quicker and Cheaper Naval Procurement\n\nConflict in Ukraine, over the last several years in the Near East, and now over Iran, has done nothing to undermine a truth established in warfare fo...", "url": "https://maritime-executive.com/article/op-ed-an-urgent-need-for-quicker-and-cheaper-naval-procurement", "source": "The Maritime Executive", "severity": "low"}, {"id": 19, "content": "<b>The Maritime Executive</b><br>Iran Claims to Have Hit an MSC Container Ship in the Mideast", "start": "2026-04-05T17:35:00+00:00", "className": "maritime", "title": "Iran Claims to Have Hit an MSC Container Ship in the Mideast\n\nOn Saturday, Iran&#x27;s Islamic Revolutionary Guard Corps claimed a drone strike on an MSC container ship at a position in the Gulf region. &quot;A drone stru...", "url": "https://maritime-executive.com/article/iran-claims-to-have-hit-an-msc-container-ship-in-the-mideast", "source": "The Maritime Executive", "severity": "low"}, {"id": 20, "content": "<b>Bleeping Computer</b><br>Hackers exploit React2Shell in automated credential theft campaign", "start": "2026-04-05T14:17:23+00:00", "className": "cyber", "title": "Hackers exploit React2Shell in automated credential theft campaign\n\nHackers are running a large-scale campaign to steal credentials in an automated way after exploiting React2Shell (CVE-2025-55182) in vulnerable Next.js apps. [...]", "url": "https://www.bleepingcomputer.com/news/security/hackers-exploit-react2shell-in-automated-credential-theft-campaign/", "source": "Bleeping Computer", "severity": "medium"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-05T14:17:23+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
