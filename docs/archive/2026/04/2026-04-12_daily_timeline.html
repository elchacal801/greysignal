<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Dark Reading</b><br>Black Hat USA", "start": "2026-08-01T11:00:00+00:00", "className": "cyber", "title": "Black Hat USA\n\n", "url": "https://www.darkreading.com/events/black-hat-usa", "source": "Dark Reading", "severity": "low"}, {"id": 1, "content": "<b>The Hacker News</b><br>CPUID Breach Distributes STX RAT via Trojanized CPU-Z and HWMonitor Downloads", "start": "2026-04-12T05:54:00+00:00", "className": "cyber", "title": "CPUID Breach Distributes STX RAT via Trojanized CPU-Z and HWMonitor Downloads\n\nUnknown threat actors compromised CPUID (&quot;cpuid[.]com&quot;), a website that hosts popular hardware monitoring tools like CPU-Z, HWMonitor, HWMonitor Pro, and PerfMonitor, for less than 24 hours to serve malicious executables for the software and deploy a remote access trojan called STX RAT. The incident", "url": "https://thehackernews.com/2026/04/cpuid-breach-distributes-stx-rat-via.html", "source": "The Hacker News", "severity": "medium"}, {"id": 2, "content": "<b>The Hacker News</b><br>Adobe Patches Actively Exploited Acrobat Reader Flaw CVE-2026-34621", "start": "2026-04-12T04:25:00+00:00", "className": "cyber", "title": "Adobe Patches Actively Exploited Acrobat Reader Flaw CVE-2026-34621\n\nAdobe has released emergency updates to fix a critical security flaw in Acrobat Reader that has come under active exploitation in the wild. The vulnerability, assigned the CVE identifier CVE-2026-34621, carries a CVSS score of 8.6 out of 10.0. Successful exploitation of the flaw could allow an attac", "url": "https://thehackernews.com/2026/04/adobe-patches-actively-exploited.html", "source": "The Hacker News", "severity": "low"}, {"id": 3, "content": "<b>The Maritime Executive</b><br>USN Gives Up on Long-Delayed Overhaul of Sub USS Boise", "start": "2026-04-11T16:54:12+00:00", "className": "maritime", "title": "USN Gives Up on Long-Delayed Overhaul of Sub USS Boise\n\nThe U.S. Navy confirmed on Friday, April 10, that it is giving up on the long-delayed overhaul of the nuclear attack submarine USS Boise. The failed...", "url": "https://maritime-executive.com/article/usn-gives-up-on-long-delayed-overhaul-of-sub-uss-boise", "source": "The Maritime Executive", "severity": "low"}, {"id": 4, "content": "<b>Bleeping Computer</b><br>Over 20,000 crypto fraud victims identified in international crackdown", "start": "2026-04-11T14:20:40+00:00", "className": "cyber", "title": "Over 20,000 crypto fraud victims identified in international crackdown\n\nAn international law enforcement action led by the U.K.&#x27;s National Crime Agency (NCA) has identified over 20,000 victims of cryptocurrency fraud across Canada, the United Kingdom, and the United States. [...]", "url": "https://www.bleepingcomputer.com/news/security/police-identifies-20-000-victims-in-international-crypto-fraud-crackdown/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-11T14:20:40+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
