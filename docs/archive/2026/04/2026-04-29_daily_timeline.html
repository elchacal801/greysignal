security Advisories</b><br>CISA Adds Two Known Exploited Vulnerabilities to Catalog", "start": "2026-04-28T12:00:00+00:00", "className": "default", "title": "CISA Adds Two Known Exploited Vulnerabilities to Catalog\n\nCISA has added two new vulnerabilities to its Known Exploited Vulnerabilities (KEV) Catalog , based on evidence of active exploitation. CVE-2024-1708 ConnectWise ScreenConnect Path Traversal Vulnerability CVE-2026-32202 Microsoft Windows Protection Mechanism Failure Vulnerability These types of vuln", "url": "https://www.cisa.gov/news-events/alerts/2026/04/28/cisa-adds-two-known-exploited-vulnerabilities-catalog", "source": "CISA Cybersecurity Advisories", "severity": "low"}, {"id": 53, "content": "<b>The Hacker News</b><br>Why Secure Data Movement Is the Zero Trust Bottleneck Nobody Talks About", "start": "2026-04-28T11:58:00+00:00", "className": "cyber", "title": "Why Secure Data Movement Is the Zero Trust Bottleneck Nobody Talks About\n\nEvery security program is betting on the same assumption: once a system is connected, the problem is solved. Open a ticket, stand up a gateway, push the data through. Done. That assumption is wrong. It is also a major reason Zero Trust programs stall. New research my team just published puts numbers", "url": "https://thehackernews.com/2026/04/why-secure-data-movement-is-zero-trust.html", "source": "The Hacker News", "severity": "low"}, {"id": 54, "content": "<b>The Hacker News</b><br>Critical Unpatched Flaw Leaves Hugging Face LeRobot Open to Unauthenticated RCE", "start": "2026-04-28T11:18:00+00:00", "className": "cyber", "title": "Critical Unpatched Flaw Leaves Hugging Face LeRobot Open to Unauthenticated RCE\n\nCybersecurity researchers have disclosed details of a critical security flaw impacting LeRobot, Hugging Face&#x27;s open-source robotics platform with nearly 24,000 GitHub stars, that could be exploited to achieve remote code execution. The vulnerability in question is CVE-2026-25874 (CVSS score: 9.3), w", "url": "https://thehackernews.com/2026/04/critical-cve-2026-25874-leaves-hugging.html", "source": "The Hacker News", "severity": "low"}, {"id": 55, "content": "<b>Schneier on Security</b><br>What Anthropic\u2019s Mythos Means for the Future of Cybersecurity", "start": "2026-04-28T11:06:44+00:00", "className": "finance", "title": "What Anthropic\u2019s Mythos Means for the Future of Cybersecurity\n\nTwo weeks ago, Anthropic announced that its new model, Claude Mythos Preview, can autonomously find and weaponize software vulnerabilities, turning them into working exploits without expert guidance. These were vulnerabilities in key software like operating systems and internet infrastructure that t", "url": "https://www.schneier.com/blog/archives/2026/04/what-anthropics-mythos-means-for-the-future-of-cybersecurity.html", "source": "Schneier on Security", "severity": "low"}, {"id": 56, "content": "<b>The Hacker News</b><br>After Mythos: New Playbooks For a Zero-Window Era", "start": "2026-04-28T10:30:00+00:00", "className": "cyber", "title": "After Mythos: New Playbooks For a Zero-Window Era\n\nWhen patching isn\u2019t fast enough, NDR helps contain the next era of threats. If you\u2019ve been tracking advancements in AI, you know the exploit window, the short buffer that organizations relied on to patch and protect after a vulnerability disclosure, is closing fast. Anthropic\u2019s new model, Claude Myt", "url": "https://thehackernews.com/2026/04/after-mythos-new-playbooks-for-zero.html", "source": "The Hacker News", "severity": "medium"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-28T10:30:00+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
