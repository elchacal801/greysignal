ckernews.com/2026/04/3-reasons-attackers-are-using-your.html", "source": "The Hacker News", "severity": "low"}, {"id": 57, "content": "<b>Dark Reading</b><br>Are We Training AI Too Late?", "start": "2026-04-01T10:40:13+00:00", "className": "cyber", "title": "Are We Training AI Too Late?\n\nAsk the Expert: Cybersecurity teams need to expand their field of view to include new, unique threat sources, rather than relying on past, proven threat actors.", "url": "https://www.darkreading.com/cybersecurity-analytics/are-we-training-ai-too-late", "source": "Dark Reading", "severity": "low"}, {"id": 58, "content": "<b>Bleeping Computer</b><br>Google fixes fourth Chrome zero-day exploited in attacks in 2026", "start": "2026-04-01T10:25:36+00:00", "className": "cyber", "title": "Google fixes fourth Chrome zero-day exploited in attacks in 2026\n\nGoogle has fixed the fourth Chrome vulnerability exploited in zero-day attacks since the start of the year. [...]", "url": "https://www.bleepingcomputer.com/news/security/google-fixes-fourth-chrome-zero-day-exploited-in-attacks-in-2026/", "source": "Bleeping Computer", "severity": "critical"}, {"id": 59, "content": "<b>Bellingcat</b><br>Croatia\u2019s Football Team Signed Deal With Gambling Sponsor Whose Rep Used Fake Name", "start": "2026-04-01T10:00:00+00:00", "className": "geopolitics", "title": "Croatia\u2019s Football Team Signed Deal With Gambling Sponsor Whose Rep Used Fake Name\n\nThis article is the result of a collaboration with Josimar. You can find Josimar\u2019s corresponding piece here. A European academic used a false name to represent an opaque Asian-facing bookmaker that is sponsoring Croatia\u2019s national football team in the run up to the 2026 FIFA World Cup. Croatia\u2019s nat", "url": "https://www.bellingcat.com/news/2026/04/01/croatian-football-teams-deal-with-gambling-sponsor/", "source": "Bellingcat", "severity": "low"}, {"id": 60, "content": "<b>Schneier on Security</b><br>A Taxonomy of Cognitive Security", "start": "2026-04-01T09:59:07+00:00", "className": "finance", "title": "A Taxonomy of Cognitive Security\n\nLast week, I listened to a fascinating talk by K. Melton on cognitive security, cognitive hacking, and reality pentesting. The slides from the talk are here , but\u2014even better\u2014Menton has a long essay laying out the basic concepts and ideas. The whole thing is important and well worth reading, and I h", "url": "https://www.schneier.com/blog/archives/2026/04/a-taxonomy-of-cognitive-security.html", "source": "Schneier on Security", "severity": "low"}, {"id": 61, "content": "<b>Bank of England</b><br>The Bank and the PRA\u2019s response to HMT, DSIT and DBT on AI in financial services", "start": "2026-04-01T09:30:00+00:00", "className": "finance", "title": "The Bank and the PRA\u2019s response to HMT, DSIT and DBT on AI in financial services\n\nLetter from Sarah Breeden and Sam Woods to the Chancellor and Secretaries of State", "url": "https://www.bankofengland.co.uk/letter/2026/letter-from-sarah-breeden-sam-woods-to-chancellor", "source": "Bank of England", "severity": "low"}, {"id": 62, "content": "<b>Bank of England</b><br>Financial Policy Committee Record \u2013 April 2026", "start": "2026-04-01T09:30:00+00:00", "className": "finance", "title": "Financial Policy Committee Record \u2013 April 2026\n\nOur Financial Policy Committee (FPC) meets to identify risks to financial stability and agree policy actions aimed at safeguarding the resilience of the UK financial system.", "url": "https://www.bankofengland.co.uk/financial-policy-committee-record/2026/april-2026", "source": "Bank of England", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-01T09:30:00+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
