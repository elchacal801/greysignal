<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

ation...", "url": "https://maritime-executive.com/article/india-commits-1-4-billion-to-the-creation-of-a-domestic-p-i-club", "source": "The Maritime Executive", "severity": "low"}, {"id": 17, "content": "<b>The Maritime Executive</b><br>United States Ambivalent to Russian Oil Sanctions", "start": "2026-04-19T17:43:00+00:00", "className": "maritime", "title": "United States Ambivalent to Russian Oil Sanctions\n\nParticularly in the United States, where the constitution was designed to incorporate checks and balances between the different parts of government,...", "url": "https://maritime-executive.com/article/united-states-shows-ambivalence-to-russian-oil-sanctions", "source": "The Maritime Executive", "severity": "low"}, {"id": 18, "content": "<b>The Maritime Executive</b><br>Indonesia Discovered a Subsea Spy Drone. Is it Legally a Ship?", "start": "2026-04-19T17:33:46+00:00", "className": "maritime", "title": "Indonesia Discovered a Subsea Spy Drone. Is it Legally a Ship?\n\n[By Dita Liliansa]Indonesian fishers found a torpedo-like object in the waters north of Gili Trawangan, Lombok, on April 6. The exact coordinates of...", "url": "https://maritime-executive.com/article/indonesia-discovered-a-subsea-spy-drone-is-it-legally-a-ship", "source": "The Maritime Executive", "severity": "low"}, {"id": 19, "content": "<b>Bleeping Computer</b><br>Vercel confirms breach as hackers claim to be selling stolen data", "start": "2026-04-19T17:32:45+00:00", "className": "cyber", "title": "Vercel confirms breach as hackers claim to be selling stolen data\n\nCloud development platform Vercel has disclosed a security incident after threat actors claimed to have breached its systems and are attempting to sell stolen data. [...]", "url": "https://www.bleepingcomputer.com/news/security/vercel-confirms-breach-as-hackers-claim-to-be-selling-stolen-data/", "source": "Bleeping Computer", "severity": "low"}, {"id": 20, "content": "<b>Bleeping Computer</b><br>Apple account change alerts abused to send phishing emails", "start": "2026-04-19T16:03:01+00:00", "className": "cyber", "title": "Apple account change alerts abused to send phishing emails\n\nApple account change notifications are being abused to send fake iPhone purchase phishing scams within legitimate emails sent from Apple&#x27;s servers, increasing legitimacy and potentially allowing them to bypass spam filters. [...]", "url": "https://www.bleepingcomputer.com/news/security/apple-account-change-alerts-abused-to-send-phishing-emails/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 21, "content": "<b>Bleeping Computer</b><br>NIST to stop rating non-priority flaws due to volume increase", "start": "2026-04-19T14:17:43+00:00", "className": "cyber", "title": "NIST to stop rating non-priority flaws due to volume increase\n\nThe National Institute of Standards and Technology will stop assigning severity scores to lower-priority vulnerabilities due to the growing workload from rising submission volumes. [...]", "url": "https://www.bleepingcomputer.com/news/security/nist-to-stop-rating-non-priority-flaws-due-to-volume-increase/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-19T14:17:43+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
