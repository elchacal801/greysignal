: "War Game Exercise Demonstrates How Social Media Manipulation Works\n\nIn an educational game called &quot;Capture the Narrative,&quot; students created bots to sway a fictional election, simulating influence in real-world political scenarios.", "url": "https://www.darkreading.com/cyber-risk/wargame-demonstrates-social-media-manipulation", "source": "Dark Reading", "severity": "low"}, {"id": 40, "content": "<b>Schneier on Security</b><br>Upcoming Speaking Engagements", "start": "2026-04-14T16:01:47+00:00", "className": "finance", "title": "Upcoming Speaking Engagements\n\nThis is a current list of where and when I am scheduled to speak: I\u2019m speaking at DemocracyXChange 2026 in Toronto, Ontario, Canada, on April 18, 2026. I\u2019m speaking at the SANS AI Cybersecurity Summit 2026 in Arlington, Virginia, USA, at 9:40 AM ET on April 20, 2026. I\u2019m speaking at the Greater Good", "url": "https://www.schneier.com/blog/archives/2026/04/upcoming-speaking-engagements-55.html", "source": "Schneier on Security", "severity": "low"}, {"id": 41, "content": "<b>The Hacker News</b><br>New PHP Composer Flaws Enable Arbitrary Command Execution \u2014 Patches Released", "start": "2026-04-14T15:57:00+00:00", "className": "cyber", "title": "New PHP Composer Flaws Enable Arbitrary Command Execution \u2014 Patches Released\n\nTwo high-severity security vulnerabilities have been disclosed in Composer, a package manager for PHP, that, if successfully exploited, could result in arbitrary command execution. The vulnerabilities have been described as command injection flaws affecting the Perforce VCS (version control software", "url": "https://thehackernews.com/2026/04/new-php-composer-flaws-enable-arbitrary.html", "source": "The Hacker News", "severity": "low"}, {"id": 42, "content": "<b>Bleeping Computer</b><br>Microsoft rolls out fast-track to reinstate Windows hardware dev accounts", "start": "2026-04-14T15:53:50+00:00", "className": "cyber", "title": "Microsoft rolls out fast-track to reinstate Windows hardware dev accounts\n\nMicrosoft has rolled out a fast-track process to help developers regain access to accounts recently suspended from its Windows Hardware Program, following widespread complaints that they were locked out without warning. [...]", "url": "https://www.bleepingcomputer.com/news/microsoft/microsoft-rolls-out-fast-track-to-reinstate-windows-hardware-dev-accounts/", "source": "Bleeping Computer", "severity": "low"}, {"id": 43, "content": "<b>Data Center Knowledge</b><br>Cisco Tests Local Metals Recovery to Address AI Supply Chain Strain", "start": "2026-04-14T15:08:42+00:00", "className": "maritime", "title": "Cisco Tests Local Metals Recovery to Address AI Supply Chain Strain\n\nAs AI buildouts accelerate, strain on materials for servers, networking, and power systems is becoming more evident.", "url": "https://www.datacenterknowledge.com/supply-chain/cisco-tests-local-metals-recovery-as-ai-drives-supply-strain", "source": "Data Center Knowledge", "severity": "low"}, {"id": 44, "content": "<b>The Hacker News</b><br>Google Adds Rust-Based DNS Parser into Pixel 10 Modem to Enhance Security", "start": "2026-04-14T14:56:00+00:00", "className": "cyber", "title": "Google Adds Rust-Based DNS Parser into Pixel 10 Modem to Enhance Security\n\nGoogle has announced the integration of a Rust-based Domain Name System (DNS) parser into the modem firmware as part of its ongoing efforts to beef up the security of Pixel devices and push memory-safe code at a more foundational level. &quot;The new Rust-based DNS parser significantly reduces our securi", "url": "https://thehackernews.com/2026/04/google-adds-rust-based-dns-parser-into.html", "source": "The Hacker News", "severity": "low"}, {"id": 45, "content": "<b>The Hacker News</b><br>AI-Driven Pushpaganda Scam Exploits Google Discover to Spread Scareware and Ad Fraud", "start": "2026-04-14T14:30:00+00:00", "className": "cyber", "title": "AI-Driven Pushpaganda Scam Exploits Google Discover t": "2026-04-14T10:00:00+00:00", "className": "cyber", "title": "Analysis of 216M Security Findings Shows a 4x Increase In Critical Risk (2026 Report)\n\nOX Security recently analyzed 216 million security findings across 250 organizations over a 90-day period. The primary takeaway: while raw alert volume grew by 52% year-over-year, prioritized critical risk grew by nearly 400%. The surge in AI-assisted development is creating a &quot;velocity gap&quot; where t", "url": "https://thehackernews.com/2026/04/analysis-of-216m-security-findings.html", "source": "The Hacker News", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-04-14T10:00:00+00:00',
                end: '2026-08-01T11:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
