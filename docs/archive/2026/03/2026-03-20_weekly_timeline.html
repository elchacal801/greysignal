hreat Research Center to enhance cybersecurity awareness and support the strengthening of defense capabilities. It is based on independent research and observations of the current threat landscape available at the time of publication. The content is ", "url": "https://thehackernews.com/2026/03/investigating-new-click-fix-variant.html", "source": "The Hacker News", "severity": "low"}, {"id": 299, "content": "<b>Bleeping Computer</b><br>Fake enterprise VPN sites used to steal company credentials", "start": "2026-03-13T13:23:28+00:00", "className": "cyber", "title": "Fake enterprise VPN sites used to steal company credentials\n\nA threat actor tracked as Storm-2561 is distributing fake enterprise VPN clients from Ivanti, Cisco, and Fortinet to steal VPN credentials from unsuspecting users. [...]", "url": "https://www.bleepingcomputer.com/news/security/fake-enterprise-vpn-downloads-used-to-steal-company-credentials/", "source": "Bleeping Computer", "severity": "low"}, {"id": 300, "content": "<b>Dark Reading</b><br>Most Google Cloud Attacks Start With Bug Exploitation", "start": "2026-03-13T13:20:58+00:00", "className": "cyber", "title": "Most Google Cloud Attacks Start With Bug Exploitation\n\nForget stolen credentials and misconfigurations; AI means vulnerability exploits that beat patching cycles are the top cause of compromises in the cloud.", "url": "https://www.darkreading.com/cloud-security/google-cloud-attacks-bug-exploitation", "source": "Dark Reading", "severity": "low"}, {"id": 301, "content": "<b>SentinelOne</b><br>The Good, the Bad and the Ugly in Cybersecurity \u2013 Week 11", "start": "2026-03-13T13:00:44+00:00", "className": "default", "title": "The Good, the Bad and the Ugly in Cybersecurity \u2013 Week 11\n\nRansomware negotiator charged with aiding BlackCat, actors exploit FortiGate firewalls to breach networks, and Iran hacktivists wipe Stryker systems.", "url": "https://www.sentinelone.com/blog/the-good-the-bad-and-the-ugly-in-cybersecurity-week-11-7 /b><br>Academia and the \u201cAI Brain Drain\u201d", "start": "2026-03-13T11:04:50+00:00", "className": "finance", "title": "Academia and the \u201cAI Brain Drain\u201d\n\nIn 2025, Google, Amazon, Microsoft and Meta collectively spent US$380 billion on building artificial-intelligence tools. That number is expected to surge still higher this year, to $650 billion, to fund the building of physical infrastructure, such as data centers (see go.nature.com/3lzf79q ). Moreo", "url": "https://www.schneier.com/blog/archives/2026/03/academia-and-the-ai-brain-drain.html", "source": "Schneier on Security", "severity": "low"}, {"id": 306, "content": "<b>Data Center Knowledge</b><br>Digital Infrastructure Boom Faces Complex Labor Crisis", "start": "2026-03-13T09:30:00+00:00", "className": "maritime", "title": "Digital Infrastructure Boom Faces Complex Labor Crisis\n\nThe main bottleneck for the data center investment boom isn\u2019t capital, land, or energy. It\u2019s labor.", "url": "https://www.datacenterknowledge.com/data-center-career-development/digital-infrastructure-boom-faces-complex-labor-crisis", "source": "Data Center Knowledge", "severity": "low"}, {"id": 307, "content": "<b>The Hacker News</b><br>Google Fixes Two Chrome Zero-Days Exploited in the Wild Affecting Skia and V8", "start": "2026-03-13T09:17:00+00:00", "className": "cyber", "title": "Google Fixes Two Chrome Zero-Days Exploited in the Wild Affecting Skia and V8\n\nGoogle on Thursday released security updates for its Chrome web browser to address two high-severity vulnerabilities that it said have been exploited in the wild. The list of vulnerabilities is as follows - CVE-2026-3909 (CVSS score: 8.8) - An out-of-bounds write vulnerability in the Skia 2D graphic", "url": "https://thehackernews.com/2026/03/google-fixes-two-chrome-zero-days.html", "source": "The Hacker News", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-13T09:17:00+00:00',
                end: '2026-03-20T08:05:12+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
