cker News", "severity": "low"}, {"id": 69, "content": "<b>Schneier on Security</b><br>Team Mirai and Democracy", "start": "2026-03-24T11:03:56+00:00", "className": "finance", "title": "Team Mirai and Democracy\n\nJapan\u2019s election last month and the rise of the country\u2019s newest and most innovative political party, Team Mirai , illustrates the viability of a different way to do politics. In this model, technology is used to make democratic processes stronger, instead of undermining them. It is harnessed to roo", "url": "https://www.schneier.com/blog/archives/2026/03/team-mirai-and-democracy.html", "source": "Schneier on Security", "severity": "low"}, {"id": 70, "content": "<b>Bellingcat</b><br>Munition Remnants Pictured at Site of Deadly Chad Strike Match Weapon Previously Used by Sudan\u2019s RSF", "start": "2026-03-24T10:44:36+00:00", "className": "geopolitics", "title": "Munition Remnants Pictured at Site of Deadly Chad Strike Match Weapon Previously Used by Sudan\u2019s RSF\n\nMunition remnants pictured at the site of a strike that killed at least 17 people in the town of Tin\u00e9, Chad, last week appear to match a weapon previously used by Sudan\u2019s Rapid Support Forces (RSF) in the war with Sudanese government forces \u2013 despite RSF denials of involvement in the incident. Photo", "url": "https://www.bellingcat.com/news/2026/03/24/munition-remnants-pictured-at-site-of-deadly-chad-strike-match-weapon-previously-used-by-sudans-rsf/", "source": "Bellingcat", "severity": "low"}, {"id": 71, "content": "<b>The Hacker News</b><br>TeamPCP Hacks Checkmarx GitHub Actions Using Stolen CI Credentials", "start": "2026-03-24T10:38:00+00:00", "className": "cyber", "title": "TeamPCP Hacks Checkmarx GitHub Actions Using Stolen CI Credentials\n\nTwo more GitHub Actions workflows have become the latest to be compromised by credential-stealing malware by a threat actor known as TeamPCP, the cloud-native cybercriminal operation also behind the Trivy supply chain atta         var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-24T10:00:00+00:00',
                end: '2026-03-25T09:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
