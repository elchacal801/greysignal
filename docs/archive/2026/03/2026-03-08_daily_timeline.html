<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Dark Reading</b><br>[Virtual Event] Shields Up: Key Technologies Reshaping Cybersecurity Defenses", "start": "2026-03-19T15:00:00+00:00", "className": "cyber", "title": "[Virtual Event] Shields Up: Key Technologies Reshaping Cybersecurity Defenses\n\n", "url": "https://www.darkreading.com/events/shields-up-key-technologies-reshaping-cybersecurity-defenses", "source": "Dark Reading", "severity": "low"}, {"id": 1, "content": "<b>The Maritime Executive</b><br>Despite Threats, For Now The Houthis Are Standing Aside", "start": "2026-03-07T21:22:34+00:00", "className": "maritime", "title": "Despite Threats, For Now The Houthis Are Standing Aside\n\nA huge Day of Al Furqan demonstration in Sana\u2019a on March 5, in support of Iran and Lebanon\u2019s Hezbollah, was mirrored by smaller demonstrations in othe...", "url": "https://maritime-executive.com/article/despite-threats-for-now-the-houthis-are-standing-aside", "source": "The Maritime Executive", "severity": "low"}, {"id": 2, "content": "<b>The Maritime Executive</b><br>Swedish Coast Guard Boards and Detains Suspected Stateless Cargo Ship", "start": "2026-03-07T20:48:17+00:00", "className": "maritime", "title": "Swedish Coast Guard Boards and Detains Suspected Stateless Cargo Ship\n\nSwedish police and the Coast Guard swooped down on Friday afternoon, March 6, on a small cargo ship sailing through its territorial waters on suspicio...", "url": "https://maritime-executive.com/article/swedish-coast-guard-boards-and-detains-suspected-stateless-cargo-ship", "source": "The Maritime Executive", "severity": "low"}, {"id": 3, "content": "<b>Bellingcat</b><br>New Footage Shows Wanted Kinahan Cartel Kingpins Post-Sanctions", "start": "2026-03-07T17:59:30+00:00", "className": "geopolitics", "title": "New Footage Shows Wanted Kinahan Cartel Kingpins Post-Sanctions\n\nThis article is the result of a collaboration with The Sunday Times. You can find their corresponding piece here. Kinahan cartel leaders Daniel and Christy Kinahan have been photographed in Dubai, marking the most recent sighting of the wanted crime bosses since the US government put multi-million d", "url": "https://www.bellingcat.com/news/2026/03/07/new-footage-shows-wanted-kinahan-cartel-kingpins-post-sanctions/", "source": "Bellingcat", "severity": "low"}, {"id": 4, "content": "<b>Bellingcat</b><br>The Incendiary Bomb Never Seen in Israel Before", "start": "2026-03-07T17:46:31+00:00", "className": "geopolitics", "title": "The Incendiary Bomb Never Seen in Israel Before\n\nThe Israeli Air Force (IAF) has dropped 5,000 bombs on Iran since the United States and Israel launched an attack last week, according to a statement by the IAF on March 4. Bellingcat has monitored weapons used in the first few days of the war, and strikes across the region, including those that cau", "url": "https://www.bellingcat.com/news/2026/03/07/the-incendiary-bomb-never-seen-in-israel-before/", "source": "Bellingcat", "severity": "low"}, {"id": 5, "content": "<b>The Hacker News</b><br>OpenAI Codex Security Scanned 1.2 Million Commits and Found 10,561 High-Severity Issues", "start": "2026-03-07T16:28:00+00:00", "className": "cyber", "title": "OpenAI Codex Security Scanned 1.2 Million Commits and Found 10,561 High-Severity Issues\n\nOpenAI on Friday began rolling out Codex Security, an artificial intelligence (AI)-powered security agent that&#x27;s designed to find, validate, and propose fixes for vulnerabilities. The feature is available in a research preview to ChatGPT Pro, Enterprise, Business, and Edu customers via the Codex web", "url": "https://thehackernews.com/2026/03/openai-codex-security-scanned-12.html", "source": "The Hacker News", "severity": "low"}, {"id": 6, "content": "<b>Bleeping Computer</b><br>Termite ransomware breaches linked to ClickFix CastleRAT attacks", "start": "2026-03-07T16:14:32+00:00", "className": "cyber", "title": "Termite ransomware breaches linked to ClickFix CastleRAT attacks\n\nRansomware threat actors tracked as Velvet Tempest are using the ClickFix technique and legitimate Windows utilities to deploy the DonutLoader malware and the CastleRAT backdoor. [...]", "url": "https://www.bleepingcomputer.com/news/security/termite-ransomware-breaches-linked-to-clickfix-castlerat-attacks/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 7, "content": "<b>Bleeping Computer</b><br>Microsoft: Hackers abusing AI at every stage of cyberattacks", "start": "2026-03-07T15:15:25+00:00", "className": "cyber", "title": "Microsoft: Hackers abusing AI at every stage of cyberattacks\n\nMicrosoft says threat actors are increasingly using artificial intelligence in their operations to accelerate attacks, scale malicious activity, and lower technical barriers across all aspects of a cyberattack. [...]", "url": "https://www.bleepingcomputer.com/news/security/microsoft-hackers-abusing-ai-at-every-stage-of-cyberattacks/", "source": "Bleeping Computer", "severity": "low"}, {"id": 8, "content": "<b>The Hacker News</b><br>Anthropic Finds 22 Firefox Vulnerabilities Using Claude Opus 4.6 AI Model", "start": "2026-03-07T11:21:00+00:00", "className": "cyber", "title": "Anthropic Finds 22 Firefox Vulnerabilities Using Claude Opus 4.6 AI Model\n\nAnthropic on Friday said it discovered 22 new security vulnerabilities in the Firefox web browser as part of a security partnership with Mozilla. Of these, 14 have been classified as high, seven have been classified as moderate, and one has been rated low in severity. The issues were addressed in Fi", "url": "https://thehackernews.com/2026/03/anthropic-finds-22-firefox.html", "source": "The Hacker News", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-07T11:21:00+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
