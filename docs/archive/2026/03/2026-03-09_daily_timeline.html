<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

tes under intense national and international scrutiny. The sector is economically vital, supplying a signif...", "url": "https://maritime-executive.com/article/managing-conflicts-of-interest-in-bangladesh-s-ship-recycling-sector", "source": "The Maritime Executive", "severity": "low"}, {"id": 10, "content": "<b>Krebs on Security</b><br>How AI Assistants are Moving the Security Goalposts", "start": "2026-03-08T23:35:42+00:00", "className": "default", "title": "How AI Assistants are Moving the Security Goalposts\n\nAI-based assistants or &quot;agents&quot; -- autonomous programs that have access to the user&#x27;s computer, files, online services and can automate virtually any task -- are growing in popularity with developers and IT workers. But as so many eyebrow-raising headlines over the past few weeks have shown, these p", "url": "https://krebsonsecurity.com/2026/03/how-ai-assistants-are-moving-the-security-goalposts/", "source": "Krebs on Security", "severity": "low"}, {"id": 11, "content": "<b>The Maritime Executive</b><br>Report: White House Considering a Raid to Seize Kharg Island", "start": "2026-03-08T23:34:00+00:00", "className": "maritime", "title": "Report: White House Considering a Raid to Seize Kharg Island\n\nThe Trump administration is contemplating a series of special forces operations inside of Iran, potentially including a raid to seize Kharg Island, a...", "url": "https://maritime-executive.com/article/report-white-house-mulling-over-a-raid-to-seize-kharg-island", "source": "The Maritime Executive", "severity": "low"}, {"id": 12, "content": "<b>The Maritime Executive</b><br>IMO Approved Echosounder and Speed Log System With a Single Sensor", "start": "2026-03-08T22:14:00+00:00", "className": "maritime", "title": "IMO Approved Echosounder and Speed Log System With a Single Sensor\n\nIn an industry where vessel efficiency, space, and technical service cost optimization are becoming the new standard, Istanbul-based Elektro Deniz ha...", "url": "https://maritime-executive.com/article/imo-approves-echosounder-and-speed-log-system-with-a-single-sensor", "source": "The Maritime Executive", "severity": "low"}, {"id": 13, "content": "<b>The Maritime Executive</b><br>Kuwait Confirms Oil Output Slowdown as Storage Fills Up", "start": "2026-03-08T19:56:00+00:00", "className": "maritime", "title": "Kuwait Confirms Oil Output Slowdown as Storage Fills Up\n\nKuwait&#x27;s national oil company has announced plans to start throttling down production, confirming concerns that it would have to start shutting down ...", "url": "https://maritime-executive.com/article/kuwait-confirms-oil-output-slowdown-as-storage-fills-up", "source": "The Maritime Executive", "severity": "low"}, {"id": 14, "content": "<b>The Maritime Executive</b><br>Spill Cleanup Under Way at Louisiana Offshore Oil Port", "start": "2026-03-08T19:56:00+00:00", "className": "maritime", "title": "Spill Cleanup Under Way at Louisiana Offshore Oil Port\n\nThe U.S. Coast Guard is responding to a spill at the Louisiana Offshore Oil Port, the United States&#x27; only VLCC-capable loading terminal. The spill be...", "url": "https://maritime-executive.com/article/spill-cleanup-under-way-at-louisiana-offshore-oil-port", "source": "The Maritime Executive", "severity": "low"}, {"id": 15, "content": "<b>The Maritime Executive</b><br>Collaborative Delivery Models Reshape Port Infrastructure Development", "start": "2026-03-08T19:36:00+00:00", "className": "maritime", "title": "Collaborative Delivery Models Reshape Port Infrastructure Development\n\nThe traditional design-bid-build model that dominated port infrastructure development for decades is giving way to collaborative delivery approaches...", "url": "https://maritime-executive.com/article/collaborative-delivery-models-reshape-port-infrastructure-development", "source": "The Maritime Executive", "severity": "low"}, {"id": 16, "content": "<b>Bellingcat</b><br>Video Shows US Tomahawk Missile Strike Next to Girls\u2019 Scho 26-03-08T15:25:37+00:00", "className": "cyber", "title": "EU court adviser says banks must immediately refund phishing victims\n\nAthanasios Rantos, the Advocate General of the Court of Justice of the EU (CJEU), has issued a formal opinion suggesting that banks must immediately refund account holders affected by unauthorized transactions, even when it&#x27;s their fault. [...]", "url": "https://www.bleepingcomputer.com/news/legal/eu-court-adviser-says-banks-must-immediately-refund-phishing-victims/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 20, "content": "<b>Bleeping Computer</b><br>Hackers abuse .arpa DNS and ipv6 to evade phishing defenses", "start": "2026-03-08T14:12:22+00:00", "className": "cyber", "title": "Hackers abuse .arpa DNS and ipv6 to evade phishing defenses\n\nThreat actors are abusing the special-use &quot;.arpa&quot; domain and IPv6 reverse DNS in phishing campaigns that more easily evade domain reputation checks and email security gateways. [...]", "url": "https://www.bleepingcomputer.com/news/security/hackers-abuse-arpa-dns-and-ipv6-to-evade-phishing-defenses/", "source": "Bleeping Computer", "severity": "medium"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-08T14:12:22+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
