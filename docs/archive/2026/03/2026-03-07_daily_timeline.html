-ugly-in-cybersecurity-week-10-7/", "source": "SentinelOne", "severity": "low"}, {"id": 29, "content": "<b>Mandiant Threat Research</b><br>Proactive Preparation and Hardening Against Destructive Attacks: 2026 Edition", "start": "2026-03-06T14:00:00+00:00", "className": "cyber", "title": "Proactive Preparation and Hardening Against Destructive Attacks: 2026 Edition\n\nWritten by: Matthew McWhirt, Bhavesh Dhake, Emilio Oropeza, Gautam Krishnan, Stuart Carrera, Greg Blaum, Michael Rudden Background Threat actors leverage destructive malware to destroy data, eliminate evidence of malicious activity, or manipulate systems in a way that renders them inoperable. Destru", "url": "https://cloud.google.com/blog/topics/threat-intelligence/preparation-hardening-destructive-attacks/", "source": "Mandiant Threat Research", "severity": "low"}, {"id": 30, "content": "<b>Dark Reading</b><br>Cyberattack on Mexico&#x27;s Gov&#x27;t Agencies Highlight AI Threat", "start": "2026-03-06T13:37:31+00:00", "className": "cyber", "title": "Cyberattack on Mexico&#x27;s Gov&#x27;t Agencies Highlight AI Threat\n\nUsing Anthropic&#x27;s Claude, OpenAI&#x27;s ChatGPT, and a detailed playbook prompt, a handful of cyberattackers reportedly gained access to government agencies and its citizens&#x27; data.", "url": "https://www.darkreading.com/application-security/cyberattack-mexico-government-ai-threat", "source": "Dark Reading", "severity": "low"}, {"id": 31, "content": "<b>Schneier on Security</b><br>Claude Used to Hack Mexican Government", "start": "2026-03-06T11:53:27+00:00", "className": "finance", "title": "Claude Used to Hack Mexican Government\n\nAn unknown hacker used Anthropic\u2019s LLM to hack the Mexican government: The unknown Claude user wrote Spanish-language prompts for the chatbot to act as an elite hacker, finding vulnerabilities in government networks, writing computer scripts to exploit them and determining ways to automate data thef", "url": "https://www.schneier.com/blog/archive tributed to a ", "url": "https://thehackernews.com/2026/03/iran-linked-muddywater-hackers-target.html", "source": "The Hacker News", "severity": "high"}, {"id": 35, "content": "<b>Bleeping Computer</b><br>Ghanain man pleads guilty to role in $100 million fraud ring", "start": "2026-03-06T10:08:00+00:00", "className": "cyber", "title": "Ghanain man pleads guilty to role in $100 million fraud ring\n\nA Ghanaian national pleaded guilty to his role in a massive fraud ring that stole over $100 million from victims across the United States through business email compromise attacks and romance scams. [...]", "url": "https://www.bleepingcomputer.com/news/security/ghanain-man-pleads-guilty-to-role-in-100-million-fraud-ring/", "source": "Bleeping Computer", "severity": "low"}, {"id": 36, "content": "<b>Securelist (Kaspersky)</b><br>Exploits and vulnerabilities in Q4 2025", "start": "2026-03-06T10:00:22+00:00", "className": "cyber", "title": "Exploits and vulnerabilities in Q4 2025\n\nThis report provides statistical data on published vulnerabilities and exploits we researched during Q4 2025. It also includes summary data on the use of C2 frameworks in APT attacks.", "url": "https://securelist.com/vulnerabilities-and-exploits-in-q4-2025/119105/", "source": "Securelist (Kaspersky)", "severity": "high"}, {"id": 37, "content": "<b>Bleeping Computer</b><br>FBI investigates breach of surveillance and wiretap systems", "start": "2026-03-06T08:44:53+00:00", "className": "cyber", "title": "FBI investigates breach of surveillance and wiretap systems\n\nThe U.S. Federal Bureau of Investigation (FBI) confirmed on Thursday that it&#x27;s investigating a breach that affected systems used to manage surveillance and wiretap warrants. [...]", "url": "https://www.bleepingcomputer.com/news/security/fbi-investigates-breach-of-surveillance-and-wiretap-systems/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-06T08:44:53+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
