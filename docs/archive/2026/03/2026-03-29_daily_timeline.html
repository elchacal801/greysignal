<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>War on the Rocks</b><br>Punish Russia for Helping Iran Target the U.S. Military", "start": "2026-03-29T07:30:38+00:00", "className": "geopolitics", "title": "Punish Russia for Helping Iran Target the U.S. Military\n\nIn the second week of March, U.S. President Donald Trump insisted that Russian President Vladimir Putin wants to be \u201chelpful\u201d in the Middle East. More recently, in a spat with the E.U. foreign policy chief over America\u2019s diplomatic stance on Russia and Ukraine, Secretary of State Marco Rubio reporte", "url": "https://warontherocks.com/2026/03/punish-russia-for-helping-iran-target-the-u-s-military/", "source": "War on the Rocks", "severity": "low"}, {"id": 1, "content": "<b>The Maritime Executive</b><br>Stena RoRo Takes Delivery of the 13th E-Flexer from the China Merchants", "start": "2026-03-29T00:28:14+00:00", "className": "maritime", "title": "Stena RoRo Takes Delivery of the 13th E-Flexer from the China Merchants\n\nStena RoRo has taken delivery of the 13th ship in the 15 ship series of E-Flexer RoPax ferries from the China Merchants Industry shipyard in Weihai,...", "url": "https://maritime-executive.com/article/stena-roro-takes-delivery-of-the-13th-e-flexer-from-the-china-merchants", "source": "The Maritime Executive", "severity": "low"}, {"id": 2, "content": "<b>The Maritime Executive</b><br>Generosity Raises Thousands for Charity at Subsea Expo Awards Dinner", "start": "2026-03-28T22:32:46+00:00", "className": "maritime", "title": "Generosity Raises Thousands for Charity at Subsea Expo Awards Dinner\n\n[By Global Underwater Hub}A national housing and homelessness charity has benefited thanks to the generosity of guests at the recent Subsea Expo Award...", "url": "https://maritime-executive.com/article/generosity-raises-thousands-for-charity-at-subsea-expo-awards-dinner", "source": "The Maritime Executive", "severity": "low"}, {"id": 3, "content": "<b>The Maritime Executive</b><br>UCL and RAD Publish Study on Quiet Electric Marine Technology", "start": "2026-03-28T21:36:09+00:00", "className": "maritime", "title": "UCL and RAD Publish Study on Quiet Electric Marine Technology\n\nUniversity College London (UCL) has published a landmark peer-reviewed study confirming that RAD\u2019s electric propulsion system dramatically reduces und...", "url": "https://maritime-executive.com/article/ucl-and-rad-publish-study-on-quiet-electric-marine-technology", "source": "The Maritime Executive", "severity": "low"}, {"id": 4, "content": "<b>The Maritime Executive</b><br>US Supercarrier Ford on the Move After Four Days of Repairs", "start": "2026-03-28T18:41:10+00:00", "className": "maritime", "title": "US Supercarrier Ford on the Move After Four Days of Repairs\n\nUS Naval Forces Europe confirmed that the carrier USS Gerald R. Ford is back on the move after its short stay at the naval base in Crete. It reported...", "url": "https://maritime-executive.com/article/us-supercarrier-ford-on-the-move-after-four-days-of-repairs", "source": "The Maritime Executive", "severity": "low"}, {"id": 5, "content": "<b>The Maritime Executive</b><br>Oman Suspends Operations at Key Arabian Sea Port After Drone Strike", "start": "2026-03-28T17:31:01+00:00", "className": "maritime", "title": "Oman Suspends Operations at Key Arabian Sea Port After Drone Strike\n\nThe Omani Port of Salalah, located on the Arabian Sea, came under attack on Saturday morning, March 29. The government\u2019s official news agency condemne...", "url": "https://maritime-executive.com/article/oman-suspends-operations-at-key-arabian-sea-port-after-drone-strike", "source": "The Maritime Executive", "severity": "low"}, {"id": 6, "content": "<b>The Hacker News</b><br>Iran-Linked Hackers Breach FBI Director\u2019s Personal Email, Hit Stryker With Wiper Attack", "start": "2026-03-28T15:40:00+00:00", "className": "cyber", "title": "Iran-Linked Hackers Breach FBI Director\u2019s Personal Email, Hit Stryker With Wiper Attack\n\nThreat actors with ties to Iran successfully broke into the personal email account of Kash Patel, the director of the U.S. Federal Bureau of Investigation (FBI), and leaked a cache of photos and other documents to the internet. Handala Hack Team, which carried out the breach, said on its website tha", "url": "https://thehackernews.com/2026/03/iran-linked-hackers-breach-fbi.html", "source": "The Hacker News", "severity": "low"}, {"id": 7, "content": "<b>Bleeping Computer</b><br>New Infinity Stealer malware grabs macOS data via ClickFix lures", "start": "2026-03-28T14:35:10+00:00", "className": "cyber", "title": "New Infinity Stealer malware grabs macOS data via ClickFix lures\n\nA new info-stealing malware named Infinity Stealer is targeting macOS systems with a Python payload packaged as an executable using the open-source Nuitka compiler. [...]", "url": "https://www.bleepingcomputer.com/news/security/new-infinity-stealer-malware-grabs-macos-data-via-clickfix-lures/", "source": "Bleeping Computer", "severity": "low"}, {"id": 8, "content": "<b>The Hacker News</b><br>Citrix NetScaler Under Active Recon for CVE-2026-3055 (CVSS 9.3) Memory Overread Bug", "start": "2026-03-28T09:11:00+00:00", "className": "cyber", "title": "Citrix NetScaler Under Active Recon for CVE-2026-3055 (CVSS 9.3) Memory Overread Bug\n\nA recently disclosed critical security flaw impacting Citrix NetScaler ADC and NetScaler Gateway is witnessing active reconnaissance activity, according to Defused Cyber and watchTowr. The vulnerability, CVE-2026-3055 (CVSS score: 9.3), refers to a case of insufficient input validation leading to me", "url": "https://thehackernews.com/2026/03/citrix-netscaler-under-active-recon-for.html", "source": "The Hacker News", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-28T09:11:00+00:00',
                end: '2026-03-29T07:30:38+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
