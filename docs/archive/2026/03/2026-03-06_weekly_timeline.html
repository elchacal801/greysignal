n-pleads-guilty-to-running-ai-powered-fake-id-site/", "source": "Bleeping Computer", "severity": "low"}, {"id": 303, "content": "<b>Schneier on Security</b><br>Why Tehran\u2019s Two-Tiered Internet Is So Dangerous", "start": "2026-02-27T12:05:59+00:00", "className": "finance", "title": "Why Tehran\u2019s Two-Tiered Internet Is So Dangerous\n\nIran is slowly emerging from the most severe communications blackout in its history and one of the longest in the world. Triggered as part of January\u2019s government crackdown against citizen protests nationwide, the regime implemented an internet shutdown that transcends the standard definition of int", "url": "https://www.schneier.com/blog/archives/2026/02/why-tehrans-two-tiered-internet-is-so-dangerous.html", "source": "Schneier on Security", "severity": "low"}, {"id": 304, "content": "<b>Schneier on Security</b><br>Phishing Attacks Against People Seeking Programming Jobs", "start": "2026-02-27T12:04:28+00:00", "className": "finance", "title": "Phishing Attacks Against People Seeking Programming Jobs\n\nThis is new. North Korean hackers are posing as company recruiters, enticing job candidates to participate in coding challenges. When they run the code they are supposed to work on, it installs malware on their system. News article .", "url": "https://www.schneier.com/blog/archives/2026/02/phishing-attacks-against-people-seeking-programming-jobs.html", "source": "Schneier on Security", "severity": "medium"}, {"id": 305, "content": "<b>The Hacker News</b><br>Trojanized Gaming Tools Spread Java-Based RAT via Browser and Chat Platforms", "start": "2026-02-27T10:06:00+00:00", "className": "cyber", "title": "Trojanized Gaming Tools Spread Java-Based RAT via Browser and Chat Platforms\n\nThreat actors are luring unsuspecting users into running trojanized gaming utilities that are distributed via browsers and chat platforms to distribute a remote access trojan (RAT). &quot;A malicious downloader staged a portable Java runtime and estments-confirm-4b-purchase-of-atnorth", "source": "Data Center Knowledge", "severity": "low"}, {"id": 309, "content": "<b>War on the Rocks</b><br>Why Trump\u2019s Criticism of Maliki Strengthens Him in Iraq", "start": "2026-02-27T08:30:11+00:00", "className": "geopolitics", "title": "Why Trump\u2019s Criticism of Maliki Strengthens Him in Iraq\n\nIs publicly confronting the likely next prime minister of Iraq the right strategy for the United States? The nomination of Nouri al Maliki by the Coordination Framework, the organizing body of Shiite politics in Iraq, on Jan. 24, and the blunt and public objection by President Donald Trump three day", "url": "https://warontherocks.com/2026/02/why-trumps-criticism-of-maliki-strengthens-him-in-iraq/", "source": "War on the Rocks", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-02-27T08:30:11+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
