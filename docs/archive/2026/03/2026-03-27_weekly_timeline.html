s.html", "source": "The Hacker News", "severity": "medium"}, {"id": 317, "content": "<b>Bleeping Computer</b><br>Musician admits to $10M streaming royalty fraud using AI bots", "start": "2026-03-20T09:33:33+00:00", "className": "cyber", "title": "Musician admits to $10M streaming royalty fraud using AI bots\n\nNorth Carolina musician Michael Smith has pleaded guilty to collecting over $10 million in royalty payments through a massive streaming royalty fraud scheme on Spotify, Apple Music, Amazon Music, and YouTube Music. [...]", "url": "https://www.bleepingcomputer.com/news/security/musician-pleads-guilty-to-10m-streaming-fraud-powered-by-ai-bots/", "source": "Bleeping Computer", "severity": "low"}, {"id": 318, "content": "<b>The Hacker News</b><br>Magento PolyShell Flaw Enables Unauthenticated Uploads, RCE and Account Takeover", "start": "2026-03-20T09:30:00+00:00", "className": "cyber", "title": "Magento PolyShell Flaw Enables Unauthenticated Uploads, RCE and Account Takeover\n\nSansec is warning of a critical security flaw in Magento&#x27;s REST API that could allow unauthenticated attackers to upload arbitrary executables and achieve code execution and account takeover. The vulnerability has been codenamed PolyShell by Sansec owing to the fact that the attack hinges on disguis", "url": "https://thehackernews.com/2026/03/magento-polyshell-flaw-enables.html", "source": "The Hacker News", "severity": "low"}, {"id": 319, "content": "<b>Data Center Knowledge</b><br>A Buyer\u2019s Guide to Data Center Colocation Space", "start": "2026-03-20T09:05:00+00:00", "className": "maritime", "title": "A Buyer\u2019s Guide to Data Center Colocation Space\n\nLearn how to choose the right colocation provider, optimize your space, and manage colocated servers.", "url": "https://www.datacenterknowledge.com/colocation/a-buyer-s-guide-to-data-center-colocation-space", "source": "Data Center Knowledge", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-20T09:05:00+00:00',
                end: '2026-03-27T08:20:11+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
