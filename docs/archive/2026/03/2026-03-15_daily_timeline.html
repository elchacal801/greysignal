<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Dark Reading</b><br>[Virtual Event] Shields Up: Key Technologies Reshaping Cybersecurity Defenses", "start": "2026-03-19T15:00:00+00:00", "className": "cyber", "title": "[Virtual Event] Shields Up: Key Technologies Reshaping Cybersecurity Defenses\n\n", "url": "https://www.darkreading.com/events/shields-up-key-technologies-reshaping-cybersecurity-defenses", "source": "Dark Reading", "severity": "low"}, {"id": 1, "content": "<b>Bleeping Computer</b><br>Microsoft releases Windows 11 OOB hotpatch to fix RRAS RCE flaw", "start": "2026-03-14T21:48:14+00:00", "className": "cyber", "title": "Microsoft releases Windows 11 OOB hotpatch to fix RRAS RCE flaw\n\nMicrosoft has released an out-of-band (OOB) update to fix a security vulnerabilities affecting Windows 11 Enterprise devices that receive hotpatch updates instead of the regular Patch Tuesday cumulative updates. [...]", "url": "https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-windows-11-oob-hotpatch-to-fix-rras-rce-flaw/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 2, "content": "<b>Bellingcat</b><br>Ex-UFC Fighter and Kinahan \u2018Friend\u2019 Mounir Lazzez Linked to Iran Sanctions", "start": "2026-03-14T18:02:13+00:00", "className": "geopolitics", "title": "Ex-UFC Fighter and Kinahan \u2018Friend\u2019 Mounir Lazzez Linked to Iran Sanctions\n\nThis article is the result of a collaboration with The Sunday Times. You can find their corresponding piece here. Bellingcat and The Sunday Times last week published photographs showing ex-UFC fighter Mounir \u201cThe Sniper\u201d Lazzez with wanted cartel leaders Christy and Daniel Kinahan. The images, captu", "url": "https://www.bellingcat.com/news/2026/03/14/ex-ufc-fighter-and-kinahan-friend-mounir-lazzez-linked-to-iran-sanctions/", "source": "Bellingcat", "severity": "low"}, {"id": 3, "content": "<b>The Hacker News</b><br>OpenClaw AI Agent Flaws Could Enable Prompt Injection and Data Exfiltration", "start": "2026-03-14T16:17:00+00:00", "className": "cyber", "title": "OpenClaw AI Agent Flaws Could Enable Prompt Injection and Data Exfiltration\n\nChina&#x27;s National Computer Network Emergency Response Technical Team (CNCERT) has issued a warning about the security stemming from the use of OpenClaw (formerly Clawdbot and Moltbot), an open-source and self-hosted autonomous artificial intelligence (AI) agent. In a post shared on WeChat, CNCERT not", "url": "https://thehackernews.com/2026/03/openclaw-ai-agent-flaws-could-enable.html", "source": "The Hacker News", "severity": "low"}, {"id": 4, "content": "<b>Schneier on Security</b><br>Upcoming Speaking Engagements", "start": "2026-03-14T16:02:26+00:00", "className": "finance", "title": "Upcoming Speaking Engagements\n\nThis is a current list of where and when I am scheduled to speak: I\u2019m giving the Ross Anderson Lecture at the University of Cambridge\u2019s Churchill College at 5:30 PM GMT on Thursday, March 19, 2026. I\u2019m speaking at RSAC 2026 in San Francisco, California, USA, on Wednesday, March 25, 2026. I\u2019m part of", "url": "https://www.schneier.com/blog/archives/2026/03/upcoming-speaking-engagements-54.html", "source": "Schneier on Security", "severity": "low"}, {"id": 5, "content": "<b>Bleeping Computer</b><br>AppsFlyer Web SDK hijacked to spread crypto-stealing JavaScript code", "start": "2026-03-14T14:36:42+00:00", "className": "cyber", "title": "AppsFlyer Web SDK hijacked to spread crypto-stealing JavaScript code\n\nThe AppsFlyer Web SDK was temporarily hijacked this week with malicious code used to steal cryptocurrency in a supply-chain attack. [...]", "url": "https://www.bleepingcomputer.com/news/security/appsflyer-web-sdk-used-to-spread-crypto-stealer-javascript-code/", "source": "Bleeping Computer", "severity": "high"}, {"id": 6, "content": "<b>The Hacker News</b><br>GlassWorm Supply-Chain Attack Abuses 72 Open VSX Extensions to Target Developers", "start": "2026-03-14T12:55:00+00:00", "className": "cyber", "title": "GlassWorm Supply-Chain Attack Abuses 72 Open VSX Extensions to Target Developers\n\nCybersecurity researchers have flagged a new iteration of the GlassWorm campaign that they say represents a &quot;significant escalation&quot; in how it propagates through the Open VSX registry. &quot;Instead of requiring every malicious listing to embed the loader directly, the threat actor is now abusing extensi", "url": "https://thehackernews.com/2026/03/glassworm-supply-chain-attack-abuses-72.html", "source": "The Hacker News", "severity": "high"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-14T12:55:00+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
