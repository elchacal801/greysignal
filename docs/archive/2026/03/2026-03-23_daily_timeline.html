<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Data Center Knowledge</b><br>How Stadium Data Centers Power Fans, Operations, and Broadcast", "start": "2026-03-23T09:00:00+00:00", "className": "maritime", "title": "How Stadium Data Centers Power Fans, Operations, and Broadcast\n\nAdvanced AI-driven networks and resilient infrastructure are critical to delivering exceptional fan experiences while maintaining operational integrity.", "url": "https://www.datacenterknowledge.com/networking/how-stadium-data-centers-power-fans-operations-and-broadcast", "source": "Data Center Knowledge", "severity": "low"}, {"id": 1, "content": "<b>Bleeping Computer</b><br>CISA orders feds to patch DarkSword iOS flaws exploited attacks", "start": "2026-03-23T08:37:28+00:00", "className": "cyber", "title": "CISA orders feds to patch DarkSword iOS flaws exploited attacks\n\nCISA ordered U.S. government agencies to patch three iOS vulnerabilities targeted in cryptocurrency theft and cyberespionage attacks using the DarkSword exploit kit. [...]", "url": "https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-darksword-ios-flaws-exploited-attacks/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 2, "content": "<b>The Hacker News</b><br>Trivy Hack Spreads Infostealer via Docker, Triggers Worm and Kubernetes Wiper", "start": "2026-03-23T08:31:00+00:00", "className": "cyber", "title": "Trivy Hack Spreads Infostealer via Docker, Triggers Worm and Kubernetes Wiper\n\nCybersecurity researchers have uncovered malicious artifacts distributed via Docker Hub following the Trivy supply chain attack, highlighting the widening blast radius across developer environments. The last known clean release of Trivy on Docker Hub is 0.69.3. The malicious versions 0.69.4, 0.69.5,", "url": "https://thehackernews.com/2026/03/trivy-hack-spreads-infostealer-via.html", "source": "The Hacker News", "severity": "high"}, {"id": 3, "content": "<b>Bleeping Computer</b><br>New KB5085516 emergency update fixes Microsoft account sign-in", "start": "2026-03-23T08:04:30+00:00", "className": "cyber", "title": "New KB5085516 emergency update fixes Microsoft account sign-in\n\nMicrosoft has released an emergency update to address a major issue that breaks sign-ins with Microsoft accounts across multiple Microsoft apps, including Teams and OneDrive. [...]", "url": "https://www.bleepingcomputer.com/news/microsoft/new-kb5085516-emergency-update-fixes-microsoft-account-sign-in/", "source": "Bleeping Computer", "severity": "low"}, {"id": 4, "content": "<b>War on the Rocks</b><br>The Battlefield is the Next Betting Market", "start": "2026-03-23T07:30:53+00:00", "className": "geopolitics", "title": "The Battlefield is the Next Betting Market\n\nWhen the United States and Israel struck Iran\u2019s nuclear facilities in June last year, the operation caught many observers off guard \u2014 the planning was tightly concealed. By contrast, when Operation Epic Fury started in the early hours of Feb. 28, much of the world was staying up refreshing their scr", "url": "https://warontherocks.com/2026/03/the-battlefield-is-the-next-betting-market/", "source": "War on the Rocks", "severity": "low"}, {"id": 5, "content": "<b>War on the Rocks</b><br>Trump\u2019s Visit to China Won\u2019t Fix Much, If It Even Happens", "start": "2026-03-23T07:15:00+00:00", "className": "geopolitics", "title": "Trump\u2019s Visit to China Won\u2019t Fix Much, If It Even Happens\n\nPresident Donald Trump\u2019s suggestion that he would likely delay his planned state visit to Beijing by \u201ca month or so\u201d to focus on the war with Iran underscores the fragility of the U.S.-Chinese truce that has held since October. Expectations of a U.S.-Chinese thaw had resurfaced in recent months as b", "url": "https://warontherocks.com/2026/03/trumps-visit-to-china-wont-fix-much-if-it-even-happens/", "source": "War on the Rocks", "severity": "low"}, {"id": 6, "content": "<b>The Hacker News</b><br>Hackers Exploit CVE-2025-32975 (CVSS 10.0) to Hijack Unpatched Quest KACE SMA Systems", "start": "2026-03-23T06:15:00+00:00", "className": "cyber", "title": "Hackers Exploit CVE-2025-32975 (CVSS 10.0) to Hijack Unpatched Quest KACE SMA Systems\n\nThreat actors are suspected to be exploiting a maximum-severity security flaw impacting Quest KACE Systems Management Appliance (SMA), according to Arctic Wolf. The cybersecurity company said it observed malicious activity starting the week of March 9, 2026, in customer environments that&#x27;s consisten", "url": "https://thehackernews.com/2026/03/hackers-exploit-cve-2025-32975-cvss-100.html", "source": "The Hacker News", "severity": "low"}, {"id": 7, "content": "<b>The Maritime Executive</b><br>Iranians Feint an Attack on Diego Garcia", "start": "2026-03-23T01:02:00+00:00", "className": "maritime", "title": "Iranians Feint an Attack on Diego Garcia\n\nAlthough the incident has been accompanied by much disinformation and confusion, it is evident that on or before March 20, Iran&#x27;s IRGC attempted to f...", "url": "https://maritime-executive.com/article/iranians-feint-attack-on-diego-garcia", "source": "The Maritime Executive", "severity": "low"}, {"id": 8, "content": "<b>The Maritime Executive</b><br>Lamu Port\u2019s Cargo Throughput Jumps by 900%, Buoyed by Shipping Disruption", "start": "2026-03-23T00:19:54+00:00", "className": "maritime", "title": "Lamu Port\u2019s Cargo Throughput Jumps by 900%, Buoyed by Shipping Disruption\n\nWith ocean carriers drawing up contingency plans for cargo destined to the Gulf region, some ports on the East African coast have gained a strategic...", "url": "https://maritime-executive.com/article/lamu-port-s-cargo-throughput-jumps-by-900-buoyed-by-shipping-disruption", "source": "The Maritime Executive", "severity": "low"}, {"id": 9, "content": "<b>Chainalysis</b><br>The Resolv Hack: How One Compromised Key Printed $23 Million", "start": "2026-03-22T22:18:40+00:00", "className": "finance", "title": "The Resolv Hack: How One Compromised Key Printed $23 Million\n\nOn March 22, 2026, the Resolv DeFi protocol became the latest example of how quickly things can unravel in DeFi\u2026 The post The Resolv Hack: How One Compromised Key Printed $23 Million appeared first on Chainalysis .", "url": "https://www.chainalysis.com/blog/lessons-from-the-resolv-hack/", "source": "Chainalysis", "severity": "low"}, {"id": 10, "content": "<b>The Maritime Executive</b><br>Little Change at Strait of Hormuz After Trump&#x27;s 48-Hour Threat", "start": "2026-03-22T21:26:00+00:00", "className": "maritime", "title": "Little Change at Strait of Hormuz After Trump&#x27;s 48-Hour Threat\n\nPresident Donald Trump has given the Iranian government until Monday evening to reopen the Strait of Hormuz, which he has previously said that the U....", "url": "https://maritime-executive.com/article/little-change-at-strait-of-hormuz-after-trump-s-48-hour-threat", "source": "The Maritime Executive", "severity": "low"}, {"id": 11, "content": "<b>The Maritime Executive</b><br>Analysis: Foreign-Flag Waiver Doesn&#x27;t Put Jones Act Fleet at Risk", "start": "2026-03-22T18:05:00+00:00", "className": "maritime", "title": "Analysis: Foreign-Flag Waiver Doesn&#x27;t Put Jones Act Fleet at Risk\n\nOn March 18, 2026, the Trump administration announced the approval of a 60-day Jones Act waiver to allow foreign-flagged ship to move cargoes between...", "url": "https://maritime-executive.com/article/analysis-foreign-flag-waiver-doesn-t-put-jones-act-fleet-at-risk", "source": "The Maritime Executive", "severity": "low"}, {"id": 12, "content": "<b>The Maritime Executive</b><br>Chouest Expands in the U.S. Gulf With Acquisition of Diving Company CEES", "start": "2026-03-22T18:05:00+00:00", "className": "maritime", "title": "Chouest Expands in the U.S. Gulf With Acquisition of Diving Company CEES\n\nChampagne Energy and Environmental Solutions (CEES) has joined Edison Chouest Offshore. The acquisition, announced on March 19, will give Chouest Gro...", "url": "https://maritime-executive.com/article/chouest-expands-in-the-u-s-gulf-with-acquisition-of-diving-company-cees", "source": "The Maritime Executive", "severity": "low"}, {"id": 13, "content": "<b>Bleeping Computer</b><br>VoidStealer malware steals Chrome master key via debugger trick", "start": "2026-03-22T14:32:46+00:00", "className": "cyber", "title": "VoidStealer malware steals Chrome master key via debugger trick\n\nAn information stealer called VoidStealer uses a new approach to bypass Chrome&#x27;s Application-Bound Encryption (ABE) and extract the master key for decrypting sensitive data stored in the browser. [...]", "url": "https://www.bleepingcomputer.com/news/security/voidstealer-malware-steals-chrome-master-key-via-debugger-trick/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-03-22T14:32:46+00:00',
                end: '2026-03-23T09:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
