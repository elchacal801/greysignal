": "Minutes of the UK Money Markets Code Sub-Committee \u2013 September 2026\n\nThe Money Markets Committee is a forum for market participants and authorities to discuss the UK unsecured deposits and funding market and securities lending and repo markets.", "url": "https://www.bankofengland.co.uk/minutes/2026/september/uk-money-markets-committee-minutes-september-2026", "source": "Bank of England", "severity": "low"}, {"id": 8, "content": "<b>The Hacker News</b><br>LibreOffice and OpenOffice Flaws Let Malicious Spreadsheets Run Code Without Macro Warnings", "start": "2026-10-06T11:57:00+00:00", "className": "cyber", "title": "LibreOffice and OpenOffice Flaws Let Malicious Spreadsheets Run Code Without Macro Warnings\n\nA malicious spreadsheet can make LibreOffice and Apache OpenOffice run an attacker&#x27;s code as soon as the file is opened, security researchers have shown. There is no warning first, of the kind either program shows before it runs a macro. The attack works only when the program&#x27;s Java support is enabl", "url": "https://thehackernews.com/2026/10/libreoffice-and-openoffice-flaws-let.html", "source": "The Hacker News", "severity": "low"}, {"id": 9, "content": "<b>Bleeping Computer</b><br>Wikimedia: Rogue OpenAI agents behind unauthorized Wikipedia edits", "start": "2026-10-06T11:31:48+00:00", "className": "cyber", "title": "Wikimedia: Rogue OpenAI agents behind unauthorized Wikipedia edits\n\nThe Wikimedia Foundation says rogue OpenAI agents made unauthorized Wikipedia edits and may have been partially responsible for a May outage. [...]", "url": "https://www.bleepingcomputer.com/news/security/rogue-openai-agents-behind-potentially-malicious-wikipedia-edits/", "source": "Bleeping Computer", "severity": "low"}, {"id": 10, "content": "<b>The Hacker News</b><br>Wikimedia Says OpenAI Agents Tried to Compromise Etherpad and Use Wiki Tools as Proxies", "start": "2026-10-06T11:26:25+00:00", "className": "cyber", "title": "Wikimedia Says OpenAI Agents Tr s of employees\u2019 Microsoft, Google email accounts", "start": "2026-10-06T09:25:50+00:00", "className": "cyber", "title": "Nikkei discloses breaches of employees\u2019 Microsoft, Google email accounts\n\nOver the weekend, Japanese publishing giant Nikkei disclosed that unknown attackers recently breached two employee email accounts and used one to send thousands of phishing emails. [...]", "url": "https://www.bleepingcomputer.com/news/security/nikkei-discloses-breaches-of-employees-microsoft-google-email-accounts/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 14, "content": "<b>The Hacker News</b><br>Google Pauses OSS Product Bug Bounty Rewards After Surge in Invalid Automated Reports", "start": "2026-10-06T09:21:47+00:00", "className": "cyber", "title": "Google Pauses OSS Product Bug Bounty Rewards After Surge in Invalid Automated Reports\n\nGoogle has stopped accepting product vulnerability reports through its bug bounty program for its open-source software. The change, in effect since October 1, means researchers can no longer submit security flaws in the code of projects such as Go, Angular, and Protocol Buffers there for a reward. R", "url": "https://thehackernews.com/2026/10/google-pauses-oss-product-bug-bounty.html", "source": "The Hacker News", "severity": "low"}, {"id": 15, "content": "<b>Data Center Knowledge</b><br>The UPS Is Uninterruptible by Design. Its Future Is Not.", "start": "2026-10-06T09:00:00+00:00", "className": "maritime", "title": "The UPS Is Uninterruptible by Design. Its Future Is Not.\n\nFrom rack-level batteries to BESS and solid-state transformers, new power architectures are reshaping where and whether the UPS belongs in the data center.", "url": "https://www.datacenterknowledge.com/uptime/the-ups-is-uninterruptible-by-design-its-future-is-not-", "source": "Data Center Knowledge", "severity": "low"}, {"id": 16, "content": "<b>Bleeping Computer</b><br>Engineer sentenced for locking over 3,000 devices on employer netwo         var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-10-05T15:21:10+00:00',
                end: '2026-12-03T16:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
