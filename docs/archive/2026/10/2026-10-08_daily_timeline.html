annel One editor Marina Ovsyannikova burst onto the set of the evening newscast. She held up a hand-drawn sign behind the an", "url": "https://www.schneier.com/blog/archives/2026/10/how-technology-empowers-and-imperils-dictators.html", "source": "Schneier on Security", "severity": "low"}, {"id": 17, "content": "<b>The Hacker News</b><br>Wazza Phishkit Targets Banking, Government, and Manufacturing Across the US, EU, and Australia", "start": "2026-10-08T10:30:00+00:00", "className": "cyber", "title": "Wazza Phishkit Targets Banking, Government, and Manufacturing Across the US, EU, and Australia\n\nPhishing kits are no longer limited to copying a familiar login page and waiting for a victim to enter credentials. Attackers are increasingly building filtering, session management, and traffic controls into the infrastructure that delivers the phishing page itself. ANY.RUN has identified Wazza, a ", "url": "https://thehackernews.com/2026/10/wazza-phishkit-targets-banking.html", "source": "The Hacker News", "severity": "medium"}, {"id": 18, "content": "<b>Bleeping Computer</b><br>Owner of Empire cybercrime market gets 40 years in prison", "start": "2026-10-08T10:29:19+00:00", "className": "cyber", "title": "Owner of Empire cybercrime market gets 40 years in prison\n\nThe co-creator of Empire Market, one of the largest dark web marketplaces before its shutdown, has been sentenced to 40 years in prison for facilitating $430 million in illegal transactions from 2018 to 2020. [...]", "url": "https://www.bleepingcomputer.com/news/security/owner-of-empire-cybercrime-market-gets-40-years-in-prison/", "source": "Bleeping Computer", "severity": "low"}, {"id": 19, "content": "<b>The Hacker News</b><br>16 Malicious Firefox Extensions Pose as Rabby and OKX Wallets to Steal Recovery Phrases", "start": "2026-10-08T09:46:32+00:00", "className": "cyber", "title": "16 Malicious Firefox Extensions Pose as Rabby and OKX Wallets to Steal Recovery Phrases\n\nCybersecurity researchers have discovered a cluster of 16 malicious Mozilla Firefox extensions that are capable of stealing cryptocurrency wallet recovery phrases and private keys. &quot;The extensions masquerade as wallet portals, desktop utilities, and browser tools, but their code intercepts recovery ", "url": "https://thehackernews.com/2026/10/16-malicious-firefox-extensions-pose-as.html", "source": "The Hacker News", "severity": "low"}, {"id": 20, "content": "<b>Data Center Knowledge</b><br>How Carbon-Aware Scheduling Can Cut Data Center Emissions", "start": "2026-10-08T09:00:00+00:00", "className": "maritime", "title": "How Carbon-Aware Scheduling Can Cut Data Center Emissions\n\nAligning flexible workloads to cleaner hours and locations turns variability into measurable Scope 2 reductions.", "url": "https://www.datacenterknowledge.com/sustainability/how-carbon-aware-scheduling-can-cut-data-center-emissions", "source": "Data Center Knowledge", "severity": "low"}, {"id": 21, "content": "<b>War on the Rocks</b><br>Ten Wartime Technologies at America\u2019s 250th", "start": "2026-10-08T08:00:00+00:00", "className": "geopolitics", "title": "Ten Wartime Technologies at America\u2019s 250th\n\nFor America\u2019s 250th anniversary, Cogs of War ran ten essays on innovations forged in wartime that subsequently diffused throughout the civilian economy, or had a lasting impact on society, governance, and Americans\u2019 relationship with technology. We received submissions on a wide range of technologie", "url": "https://warontherocks.com/cogs-of-war/ten-wartime-technologies-at-americas-250th/", "source": "War on the Rocks", "severity": "low"}, {"id": 22, "content": "<b>The Hacker News</b><br>U.S. Offers Up to $10 Million for Tips on Zhang Yu, Charged in HAFNIUM Hacks", "start": "2026-10-08T07:42:04+00:00", "className": "cyber", "title": "U.S. Offers Up to $10 Million for Tips on Zhang Yu, Charged in HAFNIUM Hacks\n\nThe U.S. State Department is offering up to $10 million for information leading to the id
