 "The Record by Recorded Future", "severity": "critical"}, {"id": 20, "content": "<b>The Hacker News</b><br>The Credential Layer Is Expanding Faster Than Security Teams Can See It", "start": "2026-10-05T11:55:00+00:00", "className": "cyber", "title": "The Credential Layer Is Expanding Faster Than Security Teams Can See It\n\nEvery modern enterprise depends on credentials. This is how humans, systems, and now AI, all connect to data, services, and each other securely. GitGuardian helps secure that credential layer through three connected capabilities: Detect, Remediate, and Prevent. The journey starts with detection, bec", "url": "https://thehackernews.com/2026/10/the-credential-layer-is-expanding.html", "source": "The Hacker News", "severity": "medium"}, {"id": 21, "content": "<b>The Hacker News</b><br>Realtek Jungle SDK Exploit Attempts Deliver Cling Botnet With STUN-Based C2", "start": "2026-10-05T11:46:25+00:00", "className": "cyber", "title": "Realtek Jungle SDK Exploit Attempts Deliver Cling Botnet With STUN-Based C2\n\nThreat actors have been observed attempting to exploit a now-patched critical security flaw impacting the Realtek Jungle software development kit (SDK) to deploy a botnet malware called Cling. &quot;Cling is notable not because it introduces a new propagation technique, but because it repurposes ordinary", "url": "https://thehackernews.com/2026/10/realtek-jungle-sdk-exploit-attempts.html", "source": "The Hacker News", "severity": "medium"}, {"id": 22, "content": "<b>Schneier on Security</b><br>Another Historic Cipher Falls to AI", "start": "2026-10-05T11:04:47+00:00", "className": "finance", "title": "Another Historic Cipher Falls to AI\n\nThis one is from 1809, written by Napoleon\u2019s nephew.", "url": "https://www.schneier.com/blog/archives/2026/10/another-historic-cipher-falls-to-ai.html", "source": "Schneier on Security", "severity": "low"}, {"id": 23, "content": "<b>The Hacker News</b><br>Apple Plans Tighter macOS Full Disk Access Control         var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-10-04T17:29:00+00:00',
                end: '2026-12-03T16:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
