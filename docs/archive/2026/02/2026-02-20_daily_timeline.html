ot;temporary&quot; API key for testing and forgets to revoke it. In the past, these were minor operational risks, debts you\u2019d eventually pay down ", "url": "https://thehackernews.com/2026/02/from-exposure-to-exploitation-how-ai.html", "source": "The Hacker News", "severity": "low"}, {"id": 66, "content": "<b>Bleeping Computer</b><br>Police arrests 651 suspects in African cybercrime crackdown", "start": "2026-02-19T11:24:17+00:00", "className": "cyber", "title": "Police arrests 651 suspects in African cybercrime crackdown\n\nAfrican authorities arrested 651 suspects and recovered over $4.3 million in a joint operation targeting investment fraud, mobile money scams, and fake loan applications. [...]", "url": "https://www.bleepingcomputer.com/news/security/police-arrests-651-suspects-in-african-cybercrime-crackdown/", "source": "Bleeping Computer", "severity": "low"}, {"id": 67, "content": "<b>Securelist (Kaspersky)</b><br>Arkanix Stealer: a C++ &amp; Python infostealer", "start": "2026-02-19T11:00:49+00:00", "className": "cyber", "title": "Arkanix Stealer: a C++ &amp; Python infostealer\n\nKaspersky researchers analyze a C++ and Python stealer dubbed &quot;Arkanix Stealer&quot;, which was active for several months, targeted wide range of data, was distributed as MaaS and offered referral program to its partners.", "url": "https://securelist.com/arkanix-stealer/119006/", "source": "Securelist (Kaspersky)", "severity": "low"}, {"id": 68, "content": "<b>The Hacker News</b><br>Fake IPTV Apps Spread Massiv Android Malware Targeting Mobile Banking Users", "start": "2026-02-19T10:24:00+00:00", "className": "cyber", "title": "Fake IPTV Apps Spread Massiv Android Malware Targeting Mobile Banking Users\n\nCybersecurity researchers have disclosed details of a new Android trojan called Massiv that&#x27;s designed to facilitate device takeover (DTO) attacks for financial theft. The malware, according to ThreatFabric, masquerades as seemingly harmless IPTV apps to deceive victims, indicating that the activity", "url": "https://thehackernews.com/2026/02/fake-iptv-apps-spread-massiv-android.html", "source": "The Hacker News", "severity": "medium"}, {"id": 69, "content": "<b>Bleeping Computer</b><br>New &#x27;Massiv&#x27; Android banking malware poses as an IPTV app", "start": "2026-02-19T10:00:00+00:00", "className": "cyber", "title": "New &#x27;Massiv&#x27; Android banking malware poses as an IPTV app\n\nA newly identified Android banking trojan named Massiv has been under active distribution across south Europe, disguised as an IPTV app. [...]", "url": "https://www.bleepingcomputer.com/news/security/new-massiv-android-banking-malware-poses-as-an-iptv-app/", "source": "Bleeping Computer", "severity": "medium"}, {"id": 70, "content": "<b>Data Center Knowledge</b><br>UAE Data Centers: Powering the Middle East\u2019s AI and Cloud Revolution", "start": "2026-02-19T09:30:00+00:00", "className": "maritime", "title": "UAE Data Centers: Powering the Middle East\u2019s AI and Cloud Revolution\n\nThe UAE is transforming into a global data center hub, driven by AI, sovereign cloud, and hyperscale investments.", "url": "https://www.datacenterknowledge.com/build-design/uae-data-centers-powering-the-middle-east-s-ai-and-cloud-revolution", "source": "Data Center Knowledge", "severity": "low"}, {"id": 71, "content": "<b>War on the Rocks</b><br>When GPS Goes Dark: Building a Force That Navigates from Orbit to Seabed", "start": "2026-02-19T09:00:27+00:00", "className": "geopolitics", "title": "When GPS Goes Dark: Building a Force That Navigates from Orbit to Seabed\n\nGPS denial is no longer a theoretical future threat. It is the environment in which modern forces increasingly operate.China has invested heavily in space and counterspace capabilities designed to degrade U.S. positioning, navigation, and timing. Other state and non-state actors are following close ", "url": "https://warontherocks.com/2026/02/when-gps-goes-dark-building-a-force-that-navigates-from-orbit-to-seabed/", "source": "War on the Rocks", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-02-19T09:00:27+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
