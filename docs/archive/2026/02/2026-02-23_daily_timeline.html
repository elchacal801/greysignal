<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">

le": "Trump Increases Across-the-Board Tariff Rate to 15 Percent\n\nOn Saturday, U.S. President Donald Trump said that he would raise the United States&#x27; global baseline tariff rate to 15 percent in order to compensate...", "url": "https://maritime-executive.com/article/trump-increases-across-the-board-tariff-rate-to-15-percent", "source": "The Maritime Executive", "severity": "low"}, {"id": 7, "content": "<b>The Maritime Executive</b><br>Canada\u2019s Port of Churchill Looks into Year-Round Shipping", "start": "2026-02-23T01:07:00+00:00", "className": "maritime", "title": "Canada\u2019s Port of Churchill Looks into Year-Round Shipping\n\nWith expansion plans for Port of Churchill gaining momentum, Canada\u2019s federal government has launched a study to look into year-round shipping on Hud...", "url": "https://maritime-executive.com/article/canada-s-port-of-churchill-looks-into-year-round-shipping", "source": "The Maritime Executive", "severity": "low"}, {"id": 8, "content": "<b>The Maritime Executive</b><br>After Danish Medevac, Trump Sends Hospital Ship to Greenland", "start": "2026-02-23T01:07:00+00:00", "className": "maritime", "title": "After Danish Medevac, Trump Sends Hospital Ship to Greenland\n\nOn Saturday, the Danish Navy medevaced a sailor from a U.S. Navy submarine and delivered the individual for urgent medical treatment in Nuuk, Greenlan...", "url": "https://maritime-executive.com/article/after-danish-medevac-trump-sends-hospital-ship-to-greenland", "source": "The Maritime Executive", "severity": "low"}, {"id": 9, "content": "<b>The Maritime Executive</b><br>Barge Defaced at Cargill\u00a0Terminal in Protests Over Amazon River\u00a0Dredging", "start": "2026-02-22T23:49:00+00:00", "className": "maritime", "title": "Barge Defaced at Cargill\u00a0Terminal in Protests Over Amazon River\u00a0Dredging\n\nIndigenous protesters and environmental activists in Brazil are showing resolve in their push to stop government projects which they believe will des...", "url": "https://maritime-executive.com/article/barge-defaced-at-cargill-terminal-in-protests-over-amazon-river-dredging", "source": "The Maritime Executive", "severity": "low"}, {"id": 10, "content": "<b>The Maritime Executive</b><br>UK Consortium Proposes Floating Nuclear Plant for U.S. Military", "start": "2026-02-22T23:49:00+00:00", "className": "maritime", "title": "UK Consortium Proposes Floating Nuclear Plant for U.S. Military\n\nAn international consortium headed up by a British firm is pitching a proposal to the Pentagon to build a ship-borne nuclear power station, to be doc...", "url": "https://maritime-executive.com/article/uk-consortium-proposes-floating-nuclear-plant-for-u-s-military", "source": "The Maritime Executive", "severity": "low"}, {"id": 11, "content": "<b>The Maritime Executive</b><br>Ukrainian Drones Hit Russian Patrol Boats and Maritime Patrol Aircraft", "start": "2026-02-22T22:18:00+00:00", "className": "maritime", "title": "Ukrainian Drones Hit Russian Patrol Boats and Maritime Patrol Aircraft\n\nOn Saturday, Ukraine&#x27;s armed forces renewed their campaign of drone strikes on the naval harbor at Sevastopol, hitting two patrol ships - and proving...", "url": "https://maritime-executive.com/article/ukrainian-drones-hit-russian-patrol-boats-and-maritime-patrol-aircraft", "source": "The Maritime Executive", "severity": "low"}, {"id": 12, "content": "<b>The Maritime Executive</b><br>Russia&#x27;s Shadowy Oil Export Network Shows Signs of Central Coordination", "start": "2026-02-22T18:27:00+00:00", "className": "maritime", "title": "Russia&#x27;s Shadowy Oil Export Network Shows Signs of Central Coordination\n\nIt is well understood that Russia uses a complex network of oil traders and &quot;shadow fleet&quot; shipping companies to evade restrictions and maintain expo...", "url": "https://maritime-executive.com/article/russia-s-shadowy-oil-export-network-shows-signs-of-central-coordination", "source": "The Maritime Executive", "severity": "low"}, {"id": 13, "content": "<b>The Maritime Executive</b><br>A.P Moller Capital Invests $240 million in Morocco\u2019s Transport Sector", "start": "2026-02-22T18:27:00+00:00", "className": "maritime", "title": "A.P Moller Capital Invests $240 million in Morocco\u2019s Transport Sector\n\nA.P Moller Capital\u2019s Morocco Fund has raised $243 million, which the company intends to invest in the country\u2019s transport and logistics infrastructur...", "url": "https://maritime-executive.com/article/a-p-moller-capital-invests-240-million-in-morocco-s-transport-sector", "source": "The Maritime Executive", "severity": "low"}, {"id": 14, "content": "<b>Bleeping Computer</b><br>Arkanix Stealer pops up as short-lived AI info-stealer experiment", "start": "2026-02-22T15:33:26+00:00", "className": "cyber", "title": "Arkanix Stealer pops up as short-lived AI info-stealer experiment\n\nAn information-stealing malware operation named Arkanix Stealer, promoted on multiple dark web forums towards the end of 2025, was likely developed as an AI-assisted experiment. [...]", "url": "https://www.bleepingcomputer.com/news/security/arkanix-stealer-pops-up-as-short-lived-ai-info-stealer-experiment/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-02-22T15:33:26+00:00',
                end: '2026-03-19T15:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
