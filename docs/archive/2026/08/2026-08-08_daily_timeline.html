wflake hacker&#x27;s guilty plea covers a 100M-record breach, Mythos 5 spends 34 hours trying to backdoor real code, and ChainDrop&#x27;s worm spreads via npm.", "url": "https://www.sentinelone.com/blog/the-good-the-bad-and-the-ugly-in-cybersecurity-week-32-8/", "source": "SentinelOne", "severity": "medium"}, {"id": 33, "content": "<b>Submarine Telecoms Forum</b><br>MDM Announces Narwhal 1 and 2 Transatlantic Cables", "start": "2026-08-07T13:00:00+00:00", "className": "maritime", "title": "MDM Announces Narwhal 1 and 2 Transatlantic Cables\n\nMDM Announces Narwhal 1 and 2 Transatlantic Cables MDM, LinkedInAugust 6, 2026 MDM has announced plans for two new transatlantic subsea cable systems connecting Ireland and the United States. Narwhal 1 is planned between MDM&#x27;s existing cable landing station in Galway and Long Island, while Narwhal 2", "url": "https://subtelforum.com/mdm-announces-narwhal-1-and-2-transatlantic-cables/", "source": "Submarine Telecoms Forum", "severity": "low"}, {"id": 34, "content": "<b>The Hacker News</b><br>New WordPress Pre-Auth XSS Could Lead to PHP Code Execution - Patch ASAP", "start": "2026-08-07T12:56:23+00:00", "className": "cyber", "title": "New WordPress Pre-Auth XSS Could Lead to PHP Code Execution - Patch ASAP\n\nWordPress has fixed a pre-authentication reflected cross-site scripting (XSS) flaw in its login screen that affects every version of the content management system. pwn.ai demonstrated how the flaw can be chained into PHP code execution on the server when a logged-in administrator interacts with an a", "url": "https://thehackernews.com/2026/08/new-wordpress-pre-auth-xss-could-lead.html", "source": "The Hacker News", "severity": "medium"}, {"id": 35, "content": "<b>The Hacker News</b><br>Growing Up The Hard Way", "start": "2026-08-07T11:55:26+00:00", "className": "cyber", "title": "Growing Up The Hard Way\n\nOpen Source had a great childhood. For two decades it got to be a kid. It ran around barefoot, gave everything away, trusted strangers, and never once thought about who was watching. It ran the kind of lemonade stand that took IOUs from anyone who wandered up \u2014 take what you need, pay me back whenev", "url": "https://thehackernews.com/2026/08/growing-up-hard-way.html", "source": "The Hacker News", "severity": "low"}, {"id": 36, "content": "<b>The Hacker News</b><br>18-Year-Old Linux SCTP Flaw Could Let Local Users Gain Root and Escape Containers", "start": "2026-08-07T11:10:33+00:00", "className": "cyber", "title": "18-Year-Old Linux SCTP Flaw Could Let Local Users Gain Root and Escape Containers\n\nA use-after-free bug in Linux&#x27;s SCTP networking code can be turned into full root on a host, and Tencent researchers say they used it to escape a container and reach the machine underneath. The flaw has existed since 2008. The fix already shipped: stable kernels 7.1.6, 6.18.42, 6.12.101 and 6.6.148,", "url": "https://thehackernews.com/2026/08/18-year-old-linux-sctp-flaw-could-let.html", "source": "The Hacker News", "severity": "low"}, {"id": 37, "content": "<b>The Hacker News</b><br>New NatJack Attacks Hijack TCP Sessions and Spoof DNS by Manipulating NAT Tables", "start": "2026-08-07T10:58:38+00:00", "className": "cyber", "title": "New NatJack Attacks Hijack TCP Sessions and Spoof DNS by Manipulating NAT Tables\n\nSecurity researcher Malcolm Stagg has disclosed a new attack class called NatJack that manipulates network address translation (NAT) connection state to hijack active TCP sessions, spoof DNS responses, expose mapped ports, and exhaust NAT tables. Presented at Black Hat USA 2026, the research found a", "url": "https://thehackernews.com/2026/08/new-natjack-attacks-hijack-tcp-sessions.html", "source": "The Hacker News", "severity": "low"}, {"id": 38, "content": "<b>The Hacker News</b><br>Microsoft 365 AitM Phishing Hijacks Accounts to Collect Payroll and Finance Emails", "start": "2026-08-07T10:38:27+00:00", "className": "cyber", "title": "Microsoft 365 AitM Phishing Hijacks Accounts to Collect Payroll and Finance Emails\n\nCybersecurity researchers have called attention to an active &quot;widespread email-driven phishing campaign&quot; that employs adversary-in-the-middle (AitM) techniques to take control of Microsoft 365 accounts with an aim to identify key personnel involved in financial workflows and gather related email. &quot;T", "url": "https://thehackernews.com/2026/08/microsoft-365-aitm-phishing-hijacks.html", "source": "The Hacker News", "severity": "medium"}, {"id": 39, "content": "<b>Schneier on Security</b><br>ICE Is Buying Access to Credit Card Records", "start": "2026-08-07T10:26:41+00:00", "className": "finance", "title": "ICE Is Buying Access to Credit Card Records\n\nThrough data brokers, ICE is buying the information you provided to open a credit card.", "url": "https://www.schneier.com/blog/archives/2026/08/ice-is-buying-access-to-credit-card-records.html", "source": "Schneier on Security", "severity": "low"}, {"id": 40, "content": "<b>The Hacker News</b><br>AI-Assisted HTTP Terminator Finds Novel HTTP Desync Techniques and Apache Zero-Day", "start": "2026-08-07T10:09:54+00:00", "className": "cyber", "title": "AI-Assisted HTTP Terminator Finds Novel HTTP Desync Techniques and Apache Zero-Day\n\nPortSwigger says HTTP Terminator, an artificial intelligence (AI)-assisted research system built by James Kettle, generated and proved new HTTP desynchronization techniques after exploring 30,000 candidate desync vectors. PortSwigger said a separate human-guided discovery cascade also exposed a zero", "url": "https://thehackernews.com/2026/08/ai-assisted-http-terminator-finds-novel.html", "source": "The Hacker News", "severity": "critical"}, {"id": 41, "content": "<b>Data Center Knowledge</b><br>Do Data Centers Really Drive Up Local Temperatures?", "start": "2026-08-07T09:00:00+00:00", "className": "maritime", "title": "Do Data Centers Really Drive Up Local Temperatures?\n\nDo data centers raise local temperatures? Explore their impact, causes of heat islands, and solutions to minimize environmental effects.", "url": "https://www.datacenterknowledge.com/sustainability/do-data-centers-really-drive-up-local-temperatures", "source": "Data Center Knowledge", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-08-07T09:00:00+00:00',
                end: '2026-08-08T06:58:31+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
