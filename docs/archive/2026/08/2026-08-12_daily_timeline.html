to SYSTEM access on a fully updated Windows 11 machine. The same PnP path can be triggered over Remote Desktop without physical hardw", "url": "https://thehackernews.com/2026/08/researchers-turn-usb-auto-install-into.html", "source": "The Hacker News", "severity": "low"}, {"id": 71, "content": "<b>The Hacker News</b><br>Malicious MCP Servers Can Split Instructions to Make AI Coding Agents Exfiltrate Secrets", "start": "2026-08-11T10:24:00+00:00", "className": "cyber", "title": "Malicious MCP Servers Can Split Instructions to Make AI Coding Agents Exfiltrate Secrets\n\nA malicious tool server connected to an AI coding assistant can quietly walk off with SSH keys, environment secrets, source code, and customer data without ever sending one obviously harmful instruction. The trick can work even after a blunt version of the same theft is refused: split the request in", "url": "https://thehackernews.com/2026/08/malicious-mcp-servers-can-split.html", "source": "The Hacker News", "severity": "low"}, {"id": 72, "content": "<b>Securelist (Kaspersky)</b><br>Project CAV3RN continues: Google Apps Script as C2 relay and DNS-based C2 channel selection", "start": "2026-08-11T10:00:19+00:00", "className": "cyber", "title": "Project CAV3RN continues: Google Apps Script as C2 relay and DNS-based C2 channel selection\n\nProject CAV3RN targets Israel with Google Apps Script C2 relays and DNS-based routing. Modular .NET NativeAOT framework blends C2 traffic with legitimate Google services to evade detection.", "url": "https://securelist.com/project-cav3rn-continues/120991/", "source": "Securelist (Kaspersky)", "severity": "low"}, {"id": 73, "content": "<b>Bleeping Computer</b><br>US and South Korea warn of Gunra ransomware targeting govt agencies", "start": "2026-08-11T09:47:06+00:00", "className": "cyber", "title": "US and South Korea warn of Gunra ransomware targeting govt agencies\n\nU.S. federal agencies and South Korea&#x27;s National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks. [...]", "url": "https://www.bleepingcomputer.com/news/security/us-warns-of-gunra-ransomware-attacks-against-government-critical-infrastructure/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-08-11T09:47:06+00:00',
                end: '2026-08-12T12:57:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
