ndards release", "start": "2026-08-27T13:16:29+00:00", "className": "finance", "title": "Delay to the November 2026 RTGS standards release\n\nBank of England statement", "url": "https://www.bankofengland.co.uk/news/2026/august/delay-to-the-november-2026-rtgs-standards-release", "source": "Bank of England", "severity": "low"}, {"id": 19, "content": "<b>The Record by Recorded Future</b><br>Cyberattack on Manchester Airports Group exposes data of 8.7 million customers", "start": "2026-08-27T13:15:00+00:00", "className": "geopolitics", "title": "Cyberattack on Manchester Airports Group exposes data of 8.7 million customers\n\nA spokesperson told The Yorkshire Post that roughly 8.7 million people were impacted, although they did not provide a date range. They added that in the \u201cvast majority\u201d of cases, the only information accessed was an email address.", "url": "https://therecord.media/cyberattack-on-manchester-airports-group-exposes-millions-customer-info", "source": "The Record by Recorded Future", "severity": "low"}, {"id": 20, "content": "<b>The Record by Recorded Future</b><br>Australia charges two men for TeamPCP supply-chain hacking spree", "start": "2026-08-27T13:00:00+00:00", "className": "geopolitics", "title": "Australia charges two men for TeamPCP supply-chain hacking spree\n\nTwo men in Australia were charged Wednesday over their alleged membership in TeamPCP, the cybercrime group blamed for one of the most damaging hacking campaigns of the past year.", "url": "https://therecord.media/australia-teampcp-hackers-arrested", "source": "The Record by Recorded Future", "severity": "low"}, {"id": 21, "content": "<b>Submarine Telecoms Forum</b><br>SK Telecom Spins Off Subsea Cable Business as SK Horizon", "start": "2026-08-27T13:00:00+00:00", "className": "maritime", "title": "SK Telecom Spins Off Subsea Cable Business as SK Horizon\n\nSK Telecom Spins Off Subsea Cable Business as SK Horizon SK Telecom, PR NewswireAugust 27, 2026 SK Telecom plans to separate part of its digital infrastructure portfolio into a new company called SK Horizon. The transaction will split wholly owned subsidiary SK Broadband, leaving its fixed-line, med", "url": "https://subtelforum.com/sk-telecom-spins-off-subsea-cable-business-as-sk-horizon/", "source": "Submarine Telecoms Forum", "severity": "low"}, {"id": 22, "content": "<b>Bleeping Computer</b><br>Microsoft rolls out fix for Windows 11 crashes, gaming issues", "start": "2026-08-27T12:16:32+00:00", "className": "cyber", "title": "Microsoft rolls out fix for Windows 11 crashes, gaming issues\n\nMicrosoft has started rolling out a permanent fix for a known issue that causes system crashes and gaming issues on Windows 11 devices. [...]", "url": "https://www.bleepingcomputer.com/news/microsoft/microsoft-rolls-out-fix-for-windows-11-crashes-gaming-issues/", "source": "Bleeping Computer", "severity": "low"}, {"id": 23, "content": "<b>Bleeping Computer</b><br>Webinar: How Google Workspace breaches happen and what to do next", "start": "2026-08-27T12:16:24+00:00", "className": "cyber", "title": "Webinar: How Google Workspace breaches happen and what to do next\n\nGoogle Workspace breaches can begin with social engineering or forgotten third-party integrations rather than sophisticated exploits. This webinar examines real-world breaches, what happens during the critical first hours, and the security controls that can make the greatest difference. [...]", "url": "https://www.bleepingcomputer.com/news/security/webinar-how-google-workspace-breaches-happen-and-what-to-do-next/", "source": "Bleeping Computer", "severity": "low"}, {"id": 24, "content": "<b>The Record by Recorded Future</b><br>DOJ firearms agency says hackers breached system containing investigation targets", "start": "2026-08-27T12:15:00+00:00", "className": "geopolitics", "title": "DOJ firearms agency says hackers breached system containing investigation targets\n\nThe Bureau of Alcohol, Tobacco, Firearms and Explosives confirmed i
