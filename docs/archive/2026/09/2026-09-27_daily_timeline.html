<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreySignal Timeline</title>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background-color: #0a0e14;
            color: #b0b8c4;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a1f2e;
            margin-bottom: 16px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: #6e7681;
            font-size: 0.85em;
            margin-top: 4px;
        }

        /* Controls Bar */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #111822;
            border: 1px solid #1a1f2e;
            border-radius: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.9em;
        }
        .controls input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .controls select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
        }
        .controls .btn {
            padding: 8px 16px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
        }
        .controls .btn:hover { background: #388bfd; }
        .controls .btn.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        .controls .btn.secondary:hover { background: #30363d; }
        .event-count {
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        /* Legend */
        .legend {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }
        .legend span { margin: 0 12px; }

        /* Timeline Container */
        #timeline {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 400px;
            border: 1px solid #1a1f2e;
            background-color: #0d1117;
            border-radius: 6px;
        }

        /* Vis.js Item Styles */
        .vis-item {
            border-width: 2px !important;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vis-item.default {
            border-color: #30363d !important;
            background-color: #161b22 !important;
            color: #8b949e !important;
        }
        .vis-item.cyber {
            border-color: #ff4466 !important;
            background-color: #2d0a14 !important;
            color: #ff99aa !important;
        }
        .vis-item.finance {
            border-color: #ffd700 !important;
            background-color: #2d2a00 !important;
            color: #ffe680 !important;
        }
        .vis-item.maritime {
            border-color: #00bfff !important;
            background-color: #002233 !important;
            color: #80e5ff !important;
        }
        .vis-item.geopolitics {
            border-color: #a855f7 !important;
            background-color: #1a0a2e !important;
            color: #d4a5ff !important;
        }
        .vis-item.vis-selected {
            border-color: #f0f6fc !important;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
            z-index: 10;
        }
        .vis-time-axis .vis-text { color: #6e7681; }
        .vis-panel.vis-background { background-color: #0d1117; }

        /* Responsive */
        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .controls input[type="text"] { width: 100%; }
            #timeline { height: 60vh; }
            .header h1 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GreySignal — Intelligence Timeline</h1>
        <div class="subtitle">Click any event to open source article | Scroll to zoom | Drag to pan</div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search events..." />
        <select id="domainFilter">
            <option value="all">All Domains</option>
            <option value="cyber">Cyber Threat</option>
            <option value="finance">Finance & Macro</option>
            <option value="maritime">Maritime & Infra</option>
            <option value="geopolitics">Geopolitics & Intel</option>
        </select>
        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="btn secondary" onclick="resetFilters()">Reset</button>
        <span class="event-count" id="eventCount"></span>
    </div>

    <div class="legend">
        <span style="color:#ff4466;">&#9632; Cyber</span>
        <span style="color:#ffd700;">&#9632; Finance</span>
        <span style="color:#00bfff;">&#9632; Maritime</span>
        <span style="color:#a855f7;">&#9632; Geopolitics</span>
        <span style="color:#6e7681;">&#9632; General</span>
    </div>

    <div id="timeline"></div>

    <script type="text/javascript">
        var ALL_DATA = [{"id": 0, "content": "<b>Dark Reading</b><br>[Virtual Event] Cybersecurity Outlook 2027", "start": "2026-12-03T16:00:00+00:00", "className": "cyber", "title": "[Virtual Event] Cybersecurity Outlook 2027\n\n", "url": "https://www.darkreading.com/events/virtual-event-cybersecurity-outlook-2027", "source": "Dark Reading", "severity": "low"}, {"id": 1, "content": "<b>Dark Reading</b><br>[Virtual Event] What Every Enterprise Should Know About Securing Cloud Assets in the Age of AI", "start": "2026-11-12T16:00:00+00:00", "className": "cyber", "title": "[Virtual Event] What Every Enterprise Should Know About Securing Cloud Assets in the Age of AI\n\n", "url": "https://www.darkreading.com/events/virtual-event-what-every-enterprise-know-securing-cloud-2026", "source": "Dark Reading", "severity": "low"}, {"id": 2, "content": "<b>Dark Reading</b><br>[Virtual Event] Building a Secure AI Strategy for the Enterprise", "start": "2026-10-08T15:00:00+00:00", "className": "cyber", "title": "[Virtual Event] Building a Secure AI Strategy for the Enterprise\n\n", "url": "https://www.darkreading.com/events/virtual-event-building-secure-ai-strategy-enterprise-2026", "source": "Dark Reading", "severity": "low"}, {"id": 3, "content": "<b>Bleeping Computer</b><br>Anthropic turns Claude into an AI marketplace with 2,000+ plugins and connectors", "start": "2026-09-27T13:38:40+00:00", "className": "cyber", "title": "Anthropic turns Claude into an AI marketplace with 2,000+ plugins and connectors\n\nAnthropic has just announced a new Claude Marketplace, and it brings all AI-related tools into one place, including plugins, connectors, agents, and more. [...]", "url": "https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-turns-claude-into-an-ai-marketplace-with-2-000-plus-plugins-and-connectors/", "source": "Bleeping Computer", "severity": "low"}, {"id": 4, "content": "<b>The Hacker News</b><br>Warning: Two Unpatched Citrix NetScaler RCE Zero-Days Under Active Exploitation", "start": "2026-09-27T07:47:57+00:00", "className": "cyber", "title": "Warning: Two Unpatched Citrix NetScaler RCE Zero-Days Under Active Exploitation\n\nTwo new unpatched zero-day vulnerabilities in Citrix NetScaler ADC and NetScaler Gateway appliances that allow remote code execution are being actively exploited in the wild, security firm watchTowr said on September 26. Citrix has not confirmed the flaws or published a fix. Some administrators say ", "url": "https://thehackernews.com/2026/09/warning-two-unpatched-citrix-netscaler.html", "source": "The Hacker News", "severity": "critical"}, {"id": 5, "content": "<b>The Maritime Executive</b><br>Japanese Naval Strengthening Steals Limelight at U.S.-China Talks", "start": "2026-09-26T22:37:40+00:00", "className": "maritime", "title": "Japanese Naval Strengthening Steals Limelight at U.S.-China Talks\n\nChinese criticism of Japan\u2019s growing defense budget appears to have been one of the most consequential developments coming out of the days President X...", "url": "https://maritime-executive.com/article/japanese-naval-strengthening-steals-limelight-at-u-s-china-talks", "source": "The Maritime Executive", "severity": "low"}, {"id": 6, "content": "<b>The Maritime Executive</b><br>Port Canaveral and GT USA Sign Lease Agreement to Expand Cargo Operations", "start": "2026-09-26T20:27:11+00:00", "className": "maritime", "title": "Port Canaveral and GT USA Sign Lease Agreement to Expand Cargo Operations\n\nPort Canaveral announced today that it has executed an agreement with longtime Canaveral Cargo Terminal operator GT USA for a new lease of up to 25 y...", "url": "https://maritime-executive.com/article/port-canaveral-and-gt-usa-sign-lease-agreement-to-expand-cargo-operations", "source": "The Maritime Executive", "severity": "low"}, {"id": 7, "content": "<b>Bleeping Computer</b><br>ShinyHunters uses WAF bypass trick in Oracle PeopleSoft attacks", "start": "2026-09-26T19:03:34+00:00", "className": "cyber", "title": "ShinyHunters uses WAF bypass trick in Oracle PeopleSoft attacks\n\nThe ShinyHunters extortion gang is using a URL-encoding trick to bypass web application firewall rules that mitigate the Oracle PeopleSoft CVE-2026-35273 flaw, allowing the threat actors to resume widespread exploitation of a flaw on vulnerable servers. [...]", "url": "https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/", "source": "Bleeping Computer", "severity": "low"}, {"id": 8, "content": "<b>The Hacker News</b><br>Lunex Stealer Abuses AMD Driver to Disable Security Monitoring and Steal Browser Credentials", "start": "2026-09-26T18:22:52+00:00", "className": "cyber", "title": "Lunex Stealer Abuses AMD Driver to Disable Security Monitoring and Steal Browser Credentials\n\nThe Psychedelic Stealer malware distributed via compromised Ukrainian websites using ClickFix-style Cloudflare verification checks is part of a wider malware-as-a-service (MaaS) platform called Lunex. The new findings come from Ontinue, which described the activity as a four-stage attack chain aimed", "url": "https://thehackernews.com/2026/09/lunex-stealer-abuses-amd-driver-to.html", "source": "The Hacker News", "severity": "low"}, {"id": 9, "content": "<b>The Maritime Executive</b><br>Carnival Cruise Line Celebrates Commitment to Cleaner Oceans", "start": "2026-09-26T16:50:39+00:00", "className": "maritime", "title": "Carnival Cruise Line Celebrates Commitment to Cleaner Oceans\n\nIn recognition of International Coastal Cleanup Day on Sept. 19, Carnival Cruise Line brought ship and shoreside team members and community partners...", "url": "https://maritime-executive.com/article/carnival-cruise-line-celebrates-commitment-to-cleaner-oceans", "source": "The Maritime Executive", "severity": "low"}, {"id": 10, "content": "<b>Bleeping Computer</b><br>Claude Opus 5.5 uses 95% fewer em dashes, but its answers are getting longer", "start": "2026-09-26T16:26:58+00:00", "className": "cyber", "title": "Claude Opus 5.5 uses 95% fewer em dashes, but its answers are getting longer\n\nAnthropic&#x27;s Claude Opus 5.5 appears to be changing how it writes, with new analysis showing fewer obvious AI writing patterns, shorter sentences, and simpler wording compared with Opus 5. [...]", "url": "https://www.bleepingcomputer.com/news/artificial-intelligence/claude-opus-55-uses-95-percent-fewer-em-dashes-but-its-answers-are-getting-longer/", "source": "Bleeping Computer", "severity": "low"}, {"id": 11, "content": "<b>Bleeping Computer</b><br>Microsoft pauses KB5002907 update after Office license deactivations", "start": "2026-09-26T15:50:38+00:00", "className": "cyber", "title": "Microsoft pauses KB5002907 update after Office license deactivations\n\nMicrosoft has paused the rollout of the KB5002907 Microsoft 365 update after users report that it deactivated, or in some cases completely removed, perpetual Office 2016 and Office 2019 installations. [...]", "url": "https://www.bleepingcomputer.com/news/microsoft/microsoft-365-kb5002907-update-paused-after-office-license-deactivations/", "source": "Bleeping Computer", "severity": "low"}, {"id": 12, "content": "<b>The Maritime Executive</b><br>Crowley Names Brea Schmidt Chief Financial Officer", "start": "2026-09-26T14:45:19+00:00", "className": "maritime", "title": "Crowley Names Brea Schmidt Chief Financial Officer\n\nCrowley, a global leader in logistics, marine and energy solutions, today announced the appointment of Brea Schmidt as chief financial officer.As CFO,...", "url": "https://maritime-executive.com/article/crowley-names-brea-schmidt-chief-financial-officer", "source": "The Maritime Executive", "severity": "low"}, {"id": 13, "content": "<b>Bleeping Computer</b><br>GitHub Actions re-enabled with Mini Shai-Hulud payload still active", "start": "2026-09-26T14:19:46+00:00", "className": "cyber", "title": "GitHub Actions re-enabled with Mini Shai-Hulud payload still active\n\nTwo third-party GitHub Actions previously compromised in a Mini Shai-Hulud campaign were re-enabled by their maintainer and remained accessible for more than a week despite still pointing to malicious code. [...]", "url": "https://www.bleepingcomputer.com/news/security/github-actions-re-enabled-with-mini-shai-hulud-payload-still-active/", "source": "Bleeping Computer", "severity": "low"}];
        var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-09-26T14:19:46+00:00',
                end: '2026-12-03T16:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);
        } catch (e) {
            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
                '<p style="text-align:center; padding:50px; color:#ff4466;">Error loading timeline: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
