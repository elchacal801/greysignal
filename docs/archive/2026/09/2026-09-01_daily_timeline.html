aker that&#x27;s been put to use by a Russia-aligned threat actor known as UAC-0099 against a target in Ukraine with an aim to interfere with artificial intelligence (AI)-assisted analysis. The idea, ESET said in a series of posts on", "url": "https://thehackernews.com/2026/09/russia-aligned-uac-0099-plants-nuclear.html", "source": "The Hacker News", "severity": "low"}, {"id": 13, "content": "<b>War on the Rocks</b><br>A Rulebook for Surprises: Commanding Autonomous Aircraft", "start": "2026-09-01T08:00:28+00:00", "className": "geopolitics", "title": "A Rulebook for Surprises: Commanding Autonomous Aircraft\n\nMy greatest challenge while flight testing collaborative combat aircraft was not troubleshooting errors at high speed in the cockpit. It was when, in a single keystroke, my job shifted from pilot to something like a dog handler \u2014 a supervisor of an autonomous agent. As a test pilot, my instinct is t", "url": "https://warontherocks.com/cogs-of-war/a-rulebook-for-surprises-commanding-autonomous-aircraft/", "source": "War on the Rocks", "severity": "low"}, {"id": 14, "content": "<b>Bleeping Computer</b><br>Recently patched PaperCut zero-days used in data theft attacks", "start": "2026-09-01T07:48:24+00:00", "className": "cyber", "title": "Recently patched PaperCut zero-days used in data theft attacks\n\nTwo security vulnerabilities in the PaperCut NG and MF print management software, patched last week after being exploited as zero-days, are now being abused in data theft attacks. [...]", "url": "https://www.bleepingcomputer.com/news/security/recently-patched-papercut-zero-days-used-in-data-theft-attacks/", "source": "Bleeping Computer", "severity": "low"}, {"id": 15, "content": "<b>War on the Rocks</b><br>The Educated Operator: Rethinking Lethality in Special Operations", "start": "2026-09-01T07:30:23+00:00", "className": "geopolitics", "title": "The Educated Operator: Rethinking Lethality in Special Operations\n\nEditor\u2019s Note: While War on the Rocks h         var timeline, dataSet;

        function initTimeline(data) {
            var container = document.getElementById('timeline');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#6e7681;">No events to display.</p>';
                updateCount(0);
                return;
            }
            dataSet = new vis.DataSet(data);
            var options = {
                height: '100%',
                start: '2026-08-31T13:30:01+00:00',
                end: '2026-11-12T16:00:00+00:00',
                zoomMin: 1000 * 60 * 60 * 12,
                zoomMax: 1000 * 60 * 60 * 24 * 365,
                orientation: 'top',
                tooltip: { followMouse: true, overflowMethod: 'cap' },
                clickToUse: false,
            };
            timeline = new vis.Timeline(container, dataSet, options);

            // Click to open source URL
            timeline.on('select', function(props) {
                if (props.items && props.items.length > 0) {
                    var item = dataSet.get(props.items[0]);
                    if (item && item.url) {
                        window.open(item.url, '_blank', 'noopener,noreferrer');
                    }
                }
            });
            updateCount(data.length);
        }

        function updateCount(n) {
            document.getElementById('eventCount').textContent = n + ' events';
        }

        function applyFilters() {
            var query = document.getElementById('searchBox').value.toLowerCase();
            var domain = document.getElementById('domainFilter').value;
            var severity = document.getElementById('severityFilter').value;

            var filtered = ALL_DATA.filter(function(item) {
                if (query && item.content.toLowerCase().indexOf(query) === -1 &&
                    item.title.toLowerCase().indexOf(query) === -1) {
                    return false;
                }
                if (domain !== 'all' && item.className !== domain) return false;
                if (severity !== 'all' && item.severity !== severity) return false;
                return true;
            });

            if (timeline) timeline.destroy();
            initTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('domainFilter').value = 'all';
            document.getElementById('severityFilter').value = 'all';
            if (timeline) timeline.destroy();
            initTimeline(ALL_DATA);
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('domainFilter').addEventListener('change', applyFilters);
        document.getElementById('severityFilter').addEventListener('change', applyFilters);

        // Initialize
        try {
            initTimeline(ALL_DATA);

            console.error("Timeline Error:", e);
            document.getElementById('timeline').innerHTML =
