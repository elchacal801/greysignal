name: Daily Threat Intel Collection

on:
  schedule:
    - cron: '0 8 * * *' # Daily Morning (08:00 UTC) Brief
    - cron: '0 8 * * 5' # Weekly Friday (08:00 UTC) Deep Dive
  workflow_dispatch:
    inputs:
      report_period:
        description: 'Report Period'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: write

jobs:
  daily_brief:
    if: github.event.schedule == '0 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.report_period == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run Collection (24h)
        env:
          FETCH_DELAY_SECONDS: 2
          FETCH_TIMEOUT_SECONDS: 15
        run: python -m greysignal.main collect --days 2
      - name: Generate Reports (Daily + AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m greysignal.main report --period daily --ai
      - name: Commit artifacts
        run: |
          git config --global user.name 'GreySignal Bot'
          git config --global user.email 'bot@greysignal.local'
          git add docs/briefing.md docs/timeline.html data/events.jsonl data/audit.jsonl docs/archive/ docs/index.md docs/archive.md || true
          git diff --cached --quiet || git commit -m "Daily Intel Briefing + Portal Update [skip ci]"
          git pull --rebase
          git push

  weekly_brief:
    if: github.event.schedule == '0 8 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.report_period == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run Collection (7 Days)
        env:
          FETCH_DELAY_SECONDS: 2
          FETCH_TIMEOUT_SECONDS: 15
        run: python -m greysignal.main collect --days 7
      - name: Generate Reports (Weekly + AI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m greysignal.main report --period weekly --ai
      - name: Commit artifacts
        run: |
          git config --global user.name 'GreySignal Bot'
          git config --global user.email 'bot@greysignal.local'
          git add docs/briefing.md docs/timeline.html data/events.jsonl data/audit.jsonl docs/archive/ docs/index.md docs/archive.md || true
          git diff --cached --quiet || git commit -m "Weekly Intel Deep Dive + Portal Update [skip ci]"
          git pull --rebase
          git push
